info:
  name: Giá realtime quỹ mở
  type: http
  seq: 26
http:
  method: GET
  url: "{{baseUrl}}/market/quotes/funds/{{symbol}}"
  params:
    - name: symbol
      value: "{{symbol}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  Dữ liệu realtime của 1 mã quỹ mở. `symbol` không phân biệt hoa thường.
