get:
  operationId: quotesGetForexHistory
  tags:
    - market-data

  summary: Lịch sử giá forex
  description: Lịch sử tỷ giá 1 cặp forex — chuỗi nến close-only (`c`, các field khác null). `resolution` mặc định `1D`. `from`/`to` là Unix timestamp tính bằng **giây**.
  parameters:
    - name: symbol
      in: path
      required: true
      description: "Cặp forex 6 ký tự. VD: USDVND, EURUSD."
      schema:
        type: string
        example: USDVND
    - name: resolution
      in: query
      required: false
      description: Chỉ hỗ trợ `1D` (mặc định).
      schema:
        $ref: "../../components/schemas/market/ResolutionDaily.yaml"
    - name: from
      in: query
      required: true
      description: Thời điểm bắt đầu, Unix timestamp tính bằng **giây**.
      schema:
        type: integer
        minimum: 0
        example: 1717200000
    - name: to
      in: query
      required: true
      description: Thời điểm kết thúc, Unix timestamp tính bằng **giây**.
      schema:
        type: integer
        minimum: 0
        example: 1717545600
  responses:
    "200":
      description: "`data.series` là mảng nến `{t, o, h, l, c, v}`."
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/market/QuoteOhlcvHistoryResponse.yaml"
    "400":
      $ref: "../../components/responses/BadRequest.yaml"
    "401":
      $ref: "../../components/responses/Unauthorized.yaml"
    "404":
      $ref: "../../components/responses/NotFound.yaml"
    "429":
      $ref: "../../components/responses/RateLimited.yaml"
    "500":
      $ref: "../../components/responses/InternalError.yaml"
  x-codeSamples:
    - lang: bash
      label: cURL
      source: |
        curl -H "X-FH-APIKEY: $FINHAY_API_KEY" \
          "https://open-api.fhsc.com.vn/market/quotes/forex/USDVND/history?resolution=1D&from=1717200000&to=1717545600"
