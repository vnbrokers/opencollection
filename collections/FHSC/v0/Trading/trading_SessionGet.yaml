info:
  name: tradingSessionGet
  type: http
  seq: 10
http:
  method: GET
  url: "{{baseUrl}}/trading/market/session?exchange={{exchange}}"
  params:
    - name: exchange
      value: "{{exchange}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  Trạng thái phiên giao dịch hiện tại của 1 sàn cùng danh sách order type
  đang được nhận. Ví dụ `ATO` chỉ khả dụng trong phiên `OPEN` của HOSE,
  `ATC` chỉ khả dụng phiên `CLOSE`. Dùng để gating UI place-order.
