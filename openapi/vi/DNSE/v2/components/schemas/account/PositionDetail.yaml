type: object
properties:
  id:
    type: integer
    format: int64
    example: 177410795472387
    description: ID vị thế
  symbol:
    type: string
    example: 41I1G4000
    description: Mã chứng khoán
  marketType:
    allOf:
      - $ref: ../enums/MarketType.yaml
    example: DERIVATIVE
    description: "Loại thị trường

      - STOCK: Vị thế cơ sở

      - DERIVATIVE: Vị thế phái sinh"
  accountNo:
    type: string
    example: "0001179019"
    description: Số tiểu khoản
  status:
    allOf:
      - $ref: ../enums/PositionStatus.yaml
    example: OPEN
    description: "Trạng thái của vị thế

      - OPEN: Đang mở

      - PENDING_CLOSE: Chờ đóng

      - CLOSED: Đã đóng

      - ODD_LOT: Lô lẻ (cơ sở)"
  loanPackageId:
    type: integer
    format: int32
    example: 2278
    description: Gói vay cơ sở hoặc phái sinh
  side:
    allOf:
      - $ref: ../enums/OrderSide.yaml
    example: NB
    description: "Loại vị thế

      - NB: Mua

      - NS: Bán"
  accumulateQuantity:
    type: integer
    format: int32
    example: 6
    description: Khối lượng cộng dồn
  tradeQuantity:
    type: integer
    format: int32
    example: 1
    description: Khối lượng được giao dịch
  closedQuantity:
    type: integer
    format: int32
    example: 5
    description: Khối lượng đã đóng
  openQuantity:
    type: integer
    format: int32
    example: 1
    description: Khối lượng mở
  overNightQuantity:
    type: integer
    nullable: true
    format: int32
    example: 0
    description: Khối lượng mở qua đêm (dành cho phái sinh)
  costPrice:
    type: number
    format: float
    example: 1834.5
    description: Giá vốn trung bình của khối lượng mở
  averageCostPrice:
    type: number
    format: float
    example: 1834.5
    description: Giá vốn trung bình
  averageClosePrice:
    type: number
    format: double
    example: 1750.96
    description: Giá đóng trung bình
  marketPrice:
    type: number
    format: double
    example: 1706.1
    description: Giá thị trường
  breakEvenPrice:
    type: number
    format: double
    example: 1834.95691
    description: Giá hòa vốn
  createdDate:
    type: string
    format: date-time
    example: "2026-03-23T03:08:32.773651Z"
    description: Thời điểm mở
  modifiedDate:
    type: string
    format: date-time
    example: "2026-03-23T04:07:45.692156Z"
    description: Thời điểm cập nhật
example:
  id: 177410795472387
  symbol: 41I1G4000
  marketType: DERIVATIVE
  accountNo: "0001179019"
  status: OPEN
  loanPackageId: 2278
  side: NB
  accumulateQuantity: 6
  tradeQuantity: 1
  closedQuantity: 5
  openQuantity: 1
  overNightQuantity: 0
  costPrice: 1834.5
  averageCostPrice: 1834.5
  averageClosePrice: 1750.96
  marketPrice: 1706.1
  breakEvenPrice: 1834.95691
  createdDate: "2026-03-23T03:08:32.773651Z"
  modifiedDate: "2026-03-23T04:07:45.692156Z"
description: ""
