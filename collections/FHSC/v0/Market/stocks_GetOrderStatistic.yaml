info:
  name: Thống kê lệnh mua/bán chủ động (phiên gần nhất)
  type: http
  seq: 52
http:
  method: GET
  url: "{{baseUrl}}/market/stocks/{{symbol}}/trading/orders?date={{date}}"
  params:
    - name: symbol
      value: "{{symbol}}"
      type: path
    - name: date
      value: "{{date}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  Đây KHÔNG phải lệnh chờ trong sổ lệnh: là **lệnh đã khớp, phân loại theo bên chủ động** — mua chủ động (lifted the offer) và bán chủ động (hit the bid), bao gồm cả thoả thuận.

  Nguồn chỉ có dữ liệu **sau khi đóng phiên**: trong giờ giao dịch, request không kèm `date` trả về phiên đã đóng gần nhất, không phải hôm nay.

  `avg_volume_per_order` là `null` khi `order_count = 0`; `net_volume` có thể âm.
