info:
  name: Thông tin niêm yết
  type: http
  seq: 41
http:
  method: GET
  url: "{{baseUrl}}/market/stocks/{{symbol}}/listing"
  params:
    - name: symbol
      value: "{{symbol}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  Thông tin niêm yết của 1 mã: sàn, ngày niêm yết, giá tham chiếu ngày niêm yết, khối lượng niêm yết / lưu hành / quỹ và free-float.
