get:
  operationId: account_getPosition
  summary: Chi tiết vị thế theo ID
  parameters:
    - $ref: ../../components/parameters/XApiKey.yaml
    - $ref: ../../components/parameters/XAuxDate.yaml
    - $ref: ../../components/parameters/XSignature.yaml
    - name: marketType
      in: query
      required: true
      description: "Loại thị trường \n- STOCK: Danh sách Deal cơ sở\n- DERIVATIVE: Danh sách Deal phái sinh\n- BOND: Danh sách Deal trái phiếu"
      deprecated: false
      schema:
        $ref: ../../components/schemas/enums/MarketType.yaml
      example: DERIVATIVE
  responses:
    "200":
      description: OK
      headers:
        Content-Length:
          $ref: ../../components/headers/ContentLength.yaml
        Date:
          $ref: ../../components/headers/Date.yaml
        Vary:
          $ref: ../../components/headers/Vary.yaml
        X-Ratelimit-Limit:
          $ref: ../../components/headers/XRateLimitLimit.yaml
        X-Ratelimit-Remaining:
          $ref: ../../components/headers/XRateLimitRemaining.yaml
        X-Ratelimit-Reset:
          $ref: ../../components/headers/XRateLimitReset.yaml
        X-Tyk-Api-Expires:
          deprecated: false
          schema: {}
          example: Thu, 02 Jan 3000 15:04:00 UTC
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/account/PositionDetailResponse.yaml
          example:
            data:
              id: 177410795472387
              symbol: 41I1G4000
              marketType: DERIVATIVE
              accountNo: "0001179019"
              status: OPEN
              loanPackageId: 2278
              side: NB
              accumulateQuantity: 6
              tradeQuantity: 1
              closedQuantity: 5
              openQuantity: 1
              overNightQuantity: 0
              costPrice: 1834.5
              averageCostPrice: 1834.5
              averageClosePrice: 1750.96
              marketPrice: 1706.1
              breakEvenPrice: 1834.95691
              createdDate: "2026-03-23T03:08:32.773651Z"
              modifiedDate: "2026-03-23T04:07:45.692156Z"
    "400":
      $ref: ../../components/responses/BadRequest.yaml
    "500":
      $ref: ../../components/responses/InternalError.yaml
  tags:
    - account
parameters:
  - name: positionId
    in: path
    required: true
    description: "Id vị thế "
    deprecated: false
    schema:
      type: string
    example: "177410795472387"
