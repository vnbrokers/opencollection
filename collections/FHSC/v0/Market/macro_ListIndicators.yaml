info:
  name: Danh mục chỉ tiêu vĩ mô
  type: http
  seq: 6
http:
  method: GET
  url: "{{baseUrl}}/market/macro/indicators?tags={{tags}}&search={{search}}"
  params:
    - name: tags
      value: "{{tags}}"
      type: query
    - name: search
      value: "{{search}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  Danh mục các chỉ tiêu vĩ mô khả dụng (GDP, CPI, lãi suất…) kèm `indicator` (slug), tên, `tags` phân loại và `unit`. Gọi tool này trước để tra `slug` hợp lệ dùng cho `/market/macro/indicators/{indicator}`. Lọc tùy chọn bằng `tags` (CSV) hoặc `search`.
