info:
  name: Yêu cầu OTP để lấy JWT Token
  type: http
  seq: 2
  tags:
    - auth
http:
  method: POST
  url: "{{baseUrl}}/gaia/v1/oauth2/openapi/request-otp"
  body:
    type: json
    data: |-
      {
        "apiKey": "{{apiKey}}"
      }
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/gaia/v1/oauth2/openapi/request-otp"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "apiKey": "{{apiKey}}"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "otpId": "example-otp-id"
          }
