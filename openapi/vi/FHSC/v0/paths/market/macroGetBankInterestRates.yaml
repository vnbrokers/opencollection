get:
  operationId: macroGetBankInterestRates
  tags:
    - macroeconomics

  summary: Lãi suất tiền gửi ngân hàng
  description: |
    Lãi suất tiền gửi tiết kiệm của các ngân hàng tại Việt Nam, phân theo
    kỳ hạn (`1 Tháng`, `3 Tháng`, `6 Tháng`, `12 Tháng`, …).

    `data.bank_interest_rates` là danh sách ngân hàng; mỗi phần tử có
    `bank_name` và mảng `rates` — lãi suất từng kỳ hạn, dạng chuỗi kèm dấu
    `%` (phần thập phân dùng dấu phẩy, vd `4,4%`).
  responses:
    "200":
      description: Trả về `data.bank_interest_rates` — danh sách ngân hàng, mỗi ngân hàng kèm lãi suất theo từng kỳ hạn.
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/market/BankInterestRatesResponse.yaml"
          example:
            error_code: "0"
            message: success
            data:
              no_bank: 20
              effective_date: 31/7/2026
              bank_interest_rates:
                - bank_name: ACB
                  rates:
                    - effective_date: 31/7/2026
                      percent: 3,1%
                      duration_name: 6 Tháng
                      bank_icon_url: https://cdn.finhay.com.vn/banks/acb.png
                    - effective_date: 31/7/2026
                      percent: 4,4%
                      duration_name: 12 Tháng
                      bank_icon_url: https://cdn.finhay.com.vn/banks/acb.png
                - bank_name: Vietcombank
                  rates:
                    - effective_date: 31/7/2026
                      percent: 2,9%
                      duration_name: 6 Tháng
                      bank_icon_url: https://cdn.finhay.com.vn/banks/vcb.png
                    - effective_date: 31/7/2026
                      percent: 4,6%
                      duration_name: 12 Tháng
                      bank_icon_url: https://cdn.finhay.com.vn/banks/vcb.png
    "400":
      $ref: "../../components/responses/BadRequest.yaml"
    "401":
      $ref: "../../components/responses/Unauthorized.yaml"
    "429":
      $ref: "../../components/responses/RateLimited.yaml"
    "500":
      $ref: "../../components/responses/InternalError.yaml"
  x-codeSamples:
    - lang: bash
      label: cURL
      source: |
        curl -H "X-FH-APIKEY: $FINHAY_API_KEY" \
          "https://open-api.fhsc.com.vn/market/financial-data/bank-interest-rates"
