info:
  name: Thông tin sao kê tiền
  type: http
  seq: 3
  tags:
    - accounts

http:
  method: GET
  url: "{{baseUrl}}/erebos/v2/digital/trans-hist-cashStatements?acctno={{accountNo}}&fromDate=2025-12-01&toDate=2026-01-15&pageSize=25&pageIndex=1"
  params:
    - name: acctno
      value: "{{accountNo}}"
      type: query
      description: Số tiểu khoản.
    - name: fromDate
      value: 2025-12-01
      type: query
      description: Từ ngày giao dịch (YYYY-MM-DD).
    - name: toDate
      value: 2026-01-15
      type: query
      description: Đến ngày giao dịch (YYYY-MM-DD).
    - name: pageSize
      value: "25"
      type: query
      description: Kích thước trang.
    - name: pageIndex
      value: "1"
      type: query
      description: Số trang.
    - name: transactionCode
      value: "1153"
      type: query
      description: Loại giao dịch
      disabled: true
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("response matches the schema", function () {
          const schema = {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "type": "object",
            "properties": {
              "response": {
                "type": "array",
                "items": {
                  "type": "object",
                  "properties": {
                    "custodyID": {
                      "type": "string"
                    },
                    "transactionCode": {
                      "type": "string"
                    },
                    "debitAmount": {
                      "type": "number"
                    },
                    "transactionName": {
                      "type": "string"
                    },
                    "descriptions": {
                      "type": "string"
                    },
                    "businessDate": {
                      "type": "string"
                    },
                    "transactionNum": {
                      "type": "string"
                    },
                    "accountNo": {
                      "type": "string"
                    },
                    "transationDate": {
                      "type": "string"
                    },
                    "creditAmount": {
                      "type": "number"
                    }
                  }
                }
              }
            }
          }

          res.status === 200 && expect(res.body).to.have.jsonSchema(schema);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/erebos/v2/digital/trans-hist-cashStatements?acctno={{accountNo}}&fromDate=2025-12-01&toDate=2026-01-15&pageSize=25&pageIndex=1"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "response": [
              {
                "custodyID": "105C209414",
                "transactionCode": "1153",
                "debitAmount": 0,
                "transactionName": "Ứng truớc tiền bán",
                "descriptions": "UTTB ngày GD 16-DEC-22, ngày TT 20/12/2022 Ung truoc tien lenh ban",
                "businessDate": "2022-12-16",
                "transactionNum": "6800124310",
                "accountNo": "0001490922",
                "transationDate": "2022-12-16",
                "creditAmount": 2814359
              }
            ]
          }
