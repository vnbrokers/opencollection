      x-mint:
        href: vi/fhsc/openapi/mutual-funds/get-fund-nav-history
        metadata:
          sidebarTitle: "Lịch sử NAV của quỹ kèm benchmark"
  - target: "$.paths['/fund-trading/public/fund-certificates/{fundName}/portfolio'].get"
    update:
      x-mint:
        href: vi/fhsc/openapi/mutual-funds/get-fund-portfolio
        metadata:
          sidebarTitle: "Danh mục nắm giữ của quỹ"
  - target: "$.paths['/fund-trading/public/fund-certificates/{fundName}/asset-allocation'].get"
    update:
      x-mint:
        href: vi/fhsc/openapi/mutual-funds/get-fund-asset-allocation
        metadata:
          sidebarTitle: "Phân bổ tài sản của quỹ (bond / stock / others)"
  - target: "$.paths['/fund-trading/public/fund-certificates/{fundName}/sector-allocation'].get"
    update:
      x-mint:
