type: object
properties:
  cmd:
    type: string
    description: Tên lệnh phản hồi.
  rc:
    type: string
    description: Mã kết quả, 1 = thành công.
  data:
    type: array
    description: Danh sách vị thế đóng.
    items:
      type: object
      properties:
        symbol:
          type: string
          description: Mã hợp đồng.
        side:
          type: string
          description: Loại giao dịch (B/S).
        openPrice:
          type: number
          format: double
          description: Giá mở TB.
        closePrice:
          type: number
          format: double
          description: Giá đóng TB.
        closePosition:
          type: string
          description: Số vị thế đóng / tổng.
        fee:
          type: number
          format: double
          description: Phí giao dịch.
        tax:
          type: number
          format: double
          description: Thuế.
        closeVM:
          type: number
          format: double
          description: Lãi lỗ đã đóng.
        unrealize:
          type: number
          format: double
          description: Lãi lỗ chưa đóng.
        closePC:
          type: number
          format: double
          description: "% lãi/lỗ đã đóng."
        time:
          type: string
          description: Thời gian đóng cuối.
