get:
  operationId: quotesGetEtfOrderBook
  tags:
    - market-data

  summary: Sổ lệnh (bid/ask) ETF
  description: Độ sâu bid/ask của 1 mã ETF. Trả 404 `ORDER_BOOK_NOT_SUPPORTED` nếu mã không có depth.
  parameters:
    - name: symbol
      in: path
      required: true
      description: "Mã ETF niêm yết. VD: FUEVFVND, E1VFVN30."
      schema:
        type: string
        example: FUEVFVND
  responses:
    "200":
      description: "`data` chứa `bids[]` và `asks[]`."
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/market/QuoteOrderBookResponse.yaml"
    "400":
      $ref: "../../components/responses/BadRequest.yaml"
    "401":
      $ref: "../../components/responses/Unauthorized.yaml"
    "404":
      $ref: "../../components/responses/NotFound.yaml"
    "429":
      $ref: "../../components/responses/RateLimited.yaml"
    "500":
      $ref: "../../components/responses/InternalError.yaml"
  x-codeSamples:
    - lang: bash
      label: cURL
      source: |
        curl -H "X-FH-APIKEY: $FINHAY_API_KEY" \
          "https://open-api.fhsc.com.vn/market/quotes/etfs/FUEVFVND/order-book"
