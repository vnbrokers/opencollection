type: object
description: Chuỗi NAV theo kỳ định giá.
required:
  - symbol
  - series
properties:
  symbol:
    type: string
    description: Mã định danh (canonical, viết hoa).
    example: VNM
  currency:
    type: string
    description: Đơn vị tiền tệ.
    example: VND
  series:
    type: array
    items:
      $ref: "QuoteNavPoint.yaml"
