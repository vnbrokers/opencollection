info:
  name: Giao dịch tự doanh (phiên gần nhất)
  type: http
  seq: 50
http:
  method: GET
  url: "{{baseUrl}}/market/stocks/{{symbol}}/trading/proprietary?date={{date}}"
  params:
    - name: symbol
      value: "{{symbol}}"
      type: path
    - name: date
      value: "{{date}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  Giá trị và khối lượng mua / bán / ròng của khối tự doanh công ty chứng khoán với 1 mã trong một phiên, tách theo phương thức (khớp lệnh / thoả thuận).
