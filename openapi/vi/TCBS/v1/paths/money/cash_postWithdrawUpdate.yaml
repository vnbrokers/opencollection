"post":
  operationId: cash_postWithdrawUpdate
  tags:
    - cash
  "summary": "Rút ký quỹ"
  "description": "Rút tiền ký quỹ khỏi tài khoản phái sinh."
  responses:
    "401":
      $ref: ../../components/responses/Unauthorized.yaml
    "200":
      description: Phản hồi thành công
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/money/CashWithdrawUpdateResponse.yaml
          example:
            cmd: ""
            rc: "1"
            rs: ""
            oID: ""
            data: null
  "requestBody":
    "required": true
    "content":
      "application/json":
        "schema":
          "type": "object"
          "properties":
            "accountId":
              "type": "string"
              "description": "Số tài khoản lưu ký."
            "subAccountId":
              "type": "string"
              "description": "Phái sinh Số tiểu khoản."
            "amount":
              "type": "number"
              "format": "double"
              "description": "Withdraw margin Số tiền."
            "paymentContent":
              "type": "string"
              "description": "Withdraw Giao dịch Mô tả."
          "required":
            - "accountId"
            - "subAccountId"
            - "amount"
