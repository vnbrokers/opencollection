get:
  operationId: ticker_getIntradayBsa
  tags:
    - market
  summary: Cung cầu theo ngày
  description: Lấy dữ liệu cung cầu theo ngày của mã cổ phiếu.
  parameters:
    - name: ticker
      in: path
      required: true
      description: Mã cổ phiếu, ví dụ TCB.
      schema:
        type: string
    - name: type
      in: query
      required: false
      description:
        "Loại nhà đầu tư: sheep (small retail), wolf (medium institutional), shark (large institutional), all (mặc
        định)."
      schema:
        $ref: ../../components/schemas/enums/InvestorType.yaml
  responses:
    "401":
      $ref: ../../components/responses/Unauthorized.yaml
    "200":
      description: Phản hồi thành công
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/market/TickerIntradayBsaResponse.yaml
          example:
            ticker: TCB
            data:
              - bup: 0.65
                sdp: 0.35
                bsr: 1.25
                t: 09:15
