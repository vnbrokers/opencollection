get:
  operationId: quotesGetBondOrderBook
  tags:
    - market-data

  summary: Sổ lệnh (bid/ask) trái phiếu
  description: Độ sâu bid/ask của 1 mã trái phiếu. Trả 404 `ORDER_BOOK_NOT_SUPPORTED` nếu mã không có depth.
  parameters:
    - name: symbol
      in: path
      required: true
      description: "Mã trái phiếu HNX (VD: VIC12103, TD2434125) hoặc trái phiếu Chính phủ 10 năm (VN10Y, US10Y, JP10Y, DE10Y)."
      schema:
        type: string
        example: VIC12103
  responses:
    "200":
      description: "`data` chứa `bids[]` và `asks[]`."
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/market/QuoteOrderBookResponse.yaml"
    "400":
      $ref: "../../components/responses/BadRequest.yaml"
    "401":
      $ref: "../../components/responses/Unauthorized.yaml"
    "404":
      $ref: "../../components/responses/NotFound.yaml"
    "429":
      $ref: "../../components/responses/RateLimited.yaml"
    "500":
      $ref: "../../components/responses/InternalError.yaml"
  x-codeSamples:
    - lang: bash
      label: cURL
      source: |
        curl -H "X-FH-APIKEY: $FINHAY_API_KEY" \
          "https://open-api.fhsc.com.vn/market/quotes/bonds/VIC12103/order-book"
