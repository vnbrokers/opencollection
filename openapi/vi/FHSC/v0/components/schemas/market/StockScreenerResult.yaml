type: object
description: Kết quả sàng lọc cổ phiếu, đã phân trang.
required:
  - items
properties:
  window:
    type:
      - string
      - "null"
    description: Cửa sổ luỹ kế đã áp dụng. `null` khi quét theo `date`.
    example: 1D
  date:
    type:
      - string
      - "null"
    format: date
    description: Phiên quá khứ đã quét (`YYYY-MM-DD`). `null` khi quét theo `window`.
    example: "2026-08-05"
  updated_at:
    type: string
    format: date-time
    description: Thời điểm dữ liệu (ISO 8601 kèm offset).
    example: "2026-05-27T14:30:15+07:00"
  page:
    type: integer
    description: Trang hiện tại.
    example: 1
  page_size:
    type: integer
    description: Số mã mỗi trang.
    example: 20
  total:
    type: integer
    description: Tổng số mã khớp bộ lọc.
    example: 312
  items:
    type: array
    description: Danh sách mã.
    items:
      $ref: "StockScreenerItem.yaml"
