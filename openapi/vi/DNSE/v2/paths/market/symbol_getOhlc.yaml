get:
  operationId: symbol_getOhlc
  summary: Lịch sử OHLC
  parameters:
    - $ref: ../../components/parameters/XApiKey.yaml
    - $ref: ../../components/parameters/XAuxDate.yaml
    - $ref: ../../components/parameters/XSignature.yaml
    - name: symbol
      in: query
      required: true
      description: "Mã chứng khoán "
      deprecated: false
      schema:
        type: string
      example: ACB
    - name: type
      in: query
      required: true
      description: |-
        Loại thị trường
        - STOCK: Cổ phiếu
        - DERIVATIVE: Phái sinh
        - INDEX: Chỉ số thị trường
      deprecated: false
      schema:
        $ref: ../../components/schemas/enums/Type.yaml
      example: STOCK
    - name: resolution
      in: query
      required: true
      description: |-
        Khung thời gian nến
        - 1,3,5,15,30,1h,1D,1W
      deprecated: false
      schema:
        $ref: ../../components/schemas/enums/Resolution.yaml
      example: "15"
    - name: from
      in: query
      required: true
      description: Thời gian bắt đầu
      deprecated: false
      schema:
        type: string
      example: "1773657310"
    - name: to
      in: query
      required: true
      description: Thời gian kết thúc
      deprecated: false
      schema:
        type: string
      example: "1773830110"
  responses:
    "200":
