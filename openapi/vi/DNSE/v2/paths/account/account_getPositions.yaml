get:
  operationId: account_getPositions
  summary: Vị thế nắm giữ
  parameters:
    - $ref: ../../components/parameters/XApiKey.yaml
    - $ref: ../../components/parameters/XAuxDate.yaml
    - $ref: ../../components/parameters/XSignature.yaml
    - name: marketType
      in: query
      required: true
      description: "Loại thị trường \n- STOCK: Danh sách vị thế cơ sở\n- DERIVATIVE: Danh sách vị thế phái sinh"
      deprecated: false
      schema:
        $ref: ../../components/schemas/enums/MarketType.yaml
      example: DERIVATIVE
    - name: pageSize
      in: query
      required: true
      description: Kích thước trang dữ liệu (page size)
      deprecated: false
      schema:
        type: string
      example: "20"
  responses:
    "200":
      description: OK
      headers:
        Content-Length:
          $ref: ../../components/headers/ContentLength.yaml
        Date:
          $ref: ../../components/headers/Date.yaml
        Vary:
          $ref: ../../components/headers/Vary.yaml
        X-Ratelimit-Limit:
          $ref: ../../components/headers/XRateLimitLimit.yaml
        X-Ratelimit-Remaining:
          $ref: ../../components/headers/XRateLimitRemaining.yaml
        X-Ratelimit-Reset:
          $ref: ../../components/headers/XRateLimitReset.yaml
        X-Tyk-Api-Expires:
          deprecated: false
          schema: {}
          example: Thu, 02 Jan 3000 15:04:00 UTC
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/account/PositionsResponse.yaml
          example:
            positions:
              - id: 177410795472387
                symbol: 41I1G4000
                accountNo: "0001179019"
                marketType: DERIVATIVE
                status: OPEN
                loanPackageId: 2278
                side: NB
                accumulateQuantity: 6
                tradeQuantity: 1
                closedQuantity: 5
                openQuantity: 1
                overNightQuantity: 0
                costPrice: 1834.5
                marketPrice: 1706.1
                breakEvenPrice: 1834.95691
                createdDate: "2026-03-23T03:08:32.773651Z"
                modifiedDate: "2026-03-23T04:07:45.692156Z"
            pageIndex: 0
            pageSize: 20
            pageNumber: 1
            total: 1
    "400":
      $ref: ../../components/responses/BadRequest.yaml
    "500":
      $ref: ../../components/responses/InternalError.yaml
  tags:
    - account
parameters:
  - name: accountNo
    in: path
    required: true
    description: Số tiểu khoản
    deprecated: false
    schema:
      type: string
    example: "0001179019"
