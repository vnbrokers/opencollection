get:
  operationId: quotesGetCommodity
  tags:
    - market-data

  summary: Giá realtime hàng hoá
  description: Dữ liệu realtime của 1 mã hàng hoá. `symbol` không phân biệt hoa thường.
  parameters:
    - name: symbol
      in: path
      required: true
      description: "Mã hàng hoá ISO. VD: XAU (vàng), XAG (bạc), CL (dầu)."
      schema:
        type: string
        example: XAU
  responses:
    "200":
      description: "`data` là object quote của mã hàng hoá."
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/market/QuoteCommodityResponse.yaml"
    "400":
      $ref: "../../components/responses/BadRequest.yaml"
    "401":
      $ref: "../../components/responses/Unauthorized.yaml"
    "404":
      $ref: "../../components/responses/NotFound.yaml"
    "429":
      $ref: "../../components/responses/RateLimited.yaml"
    "500":
      $ref: "../../components/responses/InternalError.yaml"
  x-codeSamples:
    - lang: bash
      label: cURL
      source: |
        curl -H "X-FH-APIKEY: $FINHAY_API_KEY" \
          "https://open-api.fhsc.com.vn/market/quotes/commodities/XAU"
