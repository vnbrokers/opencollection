info:
  name: quotesGetDealerProductHistory
  type: http
  seq: 38
http:
  method: GET
  url: "{{baseUrl}}/market/quotes/commodities/{{symbol}}/dealer-products/{{code}}/history?from={{from}}&to={{to}}"
  params:
    - name: symbol
      value: "{{symbol}}"
      type: path
    - name: code
      value: "{{code}}"
      type: path
    - name: from
      value: "{{from}}"
      type: query
    - name: to
      value: "{{to}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  Lịch sử giá của 1 sản phẩm dealer theo `code`. `from`/`to` là Unix timestamp tính bằng **giây**.
