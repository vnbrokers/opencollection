        $ref: ../../components/schemas/enums/MarketFloor.yaml
  responses:
    "401":
      $ref: ../../components/responses/Unauthorized.yaml
    "200":
      description: Phản hồi thành công
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/market/PutThroughSnapsResponse.yaml
          example:
            buyAdv:
              - symbol: DHT
                price: 24300
                vol: 50
                time: 20231220-02:16:13.588
                status: 1
                color: 3
                orderId: DHT00000000000036
                side: B
            sellAdv:
              - symbol: TCB
                price: 24300
                vol: 50
                time: 20231220-02:16:13.588
                status: 1
                color: 3
                orderId: TCB00000000000036
                side: S
            match:
              - symbol: TCB
                price: 23455.5
                vol: 5000
                val: 117275000
