get:
  operationId: ticker_getIntradayHisPaging
  tags:
    - market
  summary: Lịch sử giá khớp
  description: Lấy lịch sử giá khớp trong phiên của mã cổ phiếu.
  parameters:
    - name: ticker
      in: path
      required: true
      description: Mã cổ phiếu, ví dụ TCB.
      schema:
        type: string
    - name: page
      in: query
      required: false
      description: Số trang (bắt đầu từ 0).
      schema:
        type: number
        format: double
    - name: size
      in: query
      required: false
      description: Kích thước trang (max 100).
      schema:
        type: number
        format: double
    - name: headIndex
      in: query
      required: false
      description: Chỉ số đầu cho phân trang ngược (mặc định -1).
      schema:
        type: number
        format: double
  responses:
    "401":
      $ref: ../../components/responses/Unauthorized.yaml
    "200":
      description: Phản hồi thành công
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/market/TickerIntradayHistoryPagingResponse.yaml
          example:
            page: 0
            size: 20
            headIndex: 3974
            numberOfItems: 10
            total: 3975
            ticker: TCB
            data:
              - p: 33850
                v: 100
                cp: -650
                a: ""
                ba: 6034800
                sa: 10320100
                hl: false
                t: 53100
