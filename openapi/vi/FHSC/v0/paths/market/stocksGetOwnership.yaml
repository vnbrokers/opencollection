get:
  operationId: stocksGetOwnership
  tags:
    - fundamental-analysis

  summary: Cơ cấu sở hữu
  description: |
    Cơ cấu sở hữu hiện tại của 1 mã: tỷ lệ nhà nước / nước ngoài / khác, danh sách cổ đông lớn và tóm tắt room ngoại. Đây là trạng thái hiện tại, không phải lịch sử giao dịch.
  parameters:
    - name: symbol
      in: path
      required: true
      description: "Mã cổ phiếu niêm yết (3–10 ký tự chữ/số, không phân biệt hoa thường). VD: VNM, FPT."
      schema:
        type: string
        example: VNM
  responses:
    "200":
      description: "`data` là cơ cấu sở hữu của mã."
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/market/StockOwnershipResponse.yaml"
    "400":
      $ref: "../../components/responses/BadRequest.yaml"
    "401":
      $ref: "../../components/responses/Unauthorized.yaml"
    "404":
      $ref: "../../components/responses/NotFound.yaml"
    "429":
      $ref: "../../components/responses/RateLimited.yaml"
    "500":
      $ref: "../../components/responses/InternalError.yaml"
  x-codeSamples:
    - lang: bash
      label: cURL
      source: |
        curl -H "X-FH-APIKEY: $FINHAY_API_KEY" \
          "https://open-api.fhsc.com.vn/market/stocks/VNM/ownership"
