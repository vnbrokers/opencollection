type: object
properties:
  id:
    type: string
    example: "966"
    description: ID lệnh
  side:
    allOf:
      - $ref: ../enums/OrderSide.yaml
    example: NS
    description: "Chiều giao dịch

      - NB: Mua

      - NS: Bán"
  accountNo:
    type: string
    example: "0001179019"
    description: Số tiểu khoản
  symbol:
    type: string
    example: 41I1G4000
    description: Mã hợp đồng phái sinh
  price:
    type: number
    format: double
    example: 1706.1
    description: Giá đặt lệnh
  quantity:
    type: integer
    format: int32
    example: 5
    description: Khối lượng đặt lệnh
  orderType:
    allOf:
      - $ref: ../enums/OrderType.yaml
    example: LO
    description: "Loại lệnh

      - LO: Lệnh giới hạn

      - MOK/MAK/MTL: Lệnh thị trường

      - ATO/ATC: Lệnh phiên định kỳ mở cửa/đóng cửa

      - PLO: Lệnh khớp lệnh sau giờ"
  loanPackageId:
    type: integer
    format: int32
    example: 2278
    description: Mã gói vay
  orderCategory:
    allOf:
      - $ref: ../enums/OrderCategory.yaml
    example: NORMAL
    description: Phân loại lệnh (mặc định NORMAL)
  orderStatus:
    allOf:
      - $ref: ../enums/OrderStatus.yaml
    example: Filled
    description: "Trạng thái lệnh

      - Pending/PendingNew: Chờ gửi

      - New: Chờ khớp

      - PartiallyFilled: Khớp một phần

      - Filled: Khớp toàn bộ

      - Rejected: Bị từ chối

      - Expired: Hết hạn trong phiên

      - DoneForDay: Lệnh được giải tỏa do không khớp trong phiên"
  fillQuantity:
    type: integer
    format: int32
    example: 5
    description: Khối lượng đã khớp
  lastQuantity:
    type: integer
    format: int32
    example: 2
    description: Khối lượng khớp gần nhất
  lastPrice:
    type: number
    format: double
    example: 1706.1
    description: Giá khớp gần nhất
  averagePrice:
    type: number
    format: double
    example: 1750.96
    description: Giá khớp trung bình
  transDate:
    type: string
    example: "2026-03-16"
    description: Ngày giao dịch
  taxRate:
    type: integer
    format: int32
    example: 0
    description: Tỷ lệ thuế
  exchangeFeeRate:
    type: integer
    format: int32
    example: 0
    description: Tỷ lệ phí trả Sở giao dịch
  feeRate:
    type: integer
    format: int32
    example: 0
    description: Tổng tỷ lệ phí của lệnh
  leaveQuantity:
    type: integer
    format: int32
    example: 0
    description: Khối lượng còn lại chưa khớp
  canceledQuantity:
    type: integer
    format: int32
    example: 0
    description: Khối lượng đã hủy
  error:
    type: string
    example: ""
    description: Mã lỗi nếu lệnh bị từ chối
  marketType:
    allOf:
      - $ref: ../enums/MarketType.yaml
    example: DERIVATIVE
    description: "Loại thị trường

      - STOCK: Sổ lệnh cơ sở

      - DERIVATIVE: Sổ lệnh phái sinh"
  priceSecure:
    type: number
    format: double
    example: 1706.1
    description: Giá dùng để kiểm tra sức mua/đặt lệnh
  createdDate:
    type: string
    format: date-time
    example: "2026-03-23T03:10:06.556826794Z"
    description: Thời điểm tạo lệnh
  modifiedDate:
    type: string
    format: date-time
    example: "2026-03-23T04:07:45.683977124Z"
    description: Thời điểm cập nhật lệnh
  metadata:
    type: string
    example: '{"orderSession":"OPEN","dealId":"1.77410795472387E14","releaseSecureOnFilled":"false","originMaker":"1000005917-close_deal_177410795472387","dtaAccountNo":"D000113702","isForeigner":false,"probType":"CUSTOMER","eventNo":5}'
    description: Thông tin bổ sung của lệnh
