type: object
properties:
  totalCash:
    type: integer
    format: int32
    example: 3720308
    description: Tổng tiền (Tiền mặt + Lãi tiền gửi + Tiền bán chờ về + Tiền cổ tức chờ về - Tiền mua trong ngày)
  availableCash:
    type: integer
    format: int32
    example: 3720022
    description: Tiền mặt hiện có
  depositInterest:
    type: integer
    format: int32
    example: 286
    description: Lãi tiền gửi không kỳ hạn
  totalDebt:
    type: integer
    format: int32
    example: 592355
    description: Tổng nợ (Nợ margin tạm thu + Nợ margin còn lại)
  depositFeeAmount:
    type: integer
    format: int32
    example: 405
    description: Phí lưu ký
  secureAmount:
    type: integer
    format: int32
    description: Tổng tiền ký quỹ
    example: 11174173
  orderSecured:
    type: integer
    format: int32
    description: Số tiền đang được phong tỏa cho các lệnh giao dịch
    example: 7903713
  withdrawableCash:
    type: integer
    format: int32
    example: 3719617
    description: Tiền có thể rút
  cashDividendReceiving:
    type: integer
    format: int32
    example: 0
    description: Tiền cổ tức chờ về
example:
  totalCash: 3720308
  availableCash: 3720022
  depositInterest: 286
  totalDebt: 592355
  depositFeeAmount: 405
  withdrawableCash: 3719617
  cashDividendReceiving: 0
description: ""
