          sidebarTitle: "Danh sách mã được nhiều quỹ giữ nhất"
  - target: "$.paths['/fund-trading/public/fund-certificates/benchmark/growth'].get"
    update:
      x-mint:
        href: vi/fhsc/openapi/mutual-funds/get-benchmark-growth
        metadata:
          sidebarTitle: "Mô phỏng tăng trưởng của số tiền đầu tư cố định qua nhiều quỹ"
  - target: "$.paths['/fund-trading/public/fund-certificates/benchmark/nav'].get"
    update:
      x-mint:
        href: vi/fhsc/openapi/mutual-funds/get-benchmark-nav
        metadata:
          sidebarTitle: "So sánh chuỗi NAV theo thời gian của nhiều quỹ"
  - target: "$.paths['/fund-trading/public/fund-certificates/benchmark/operation'].get"
    update:
      x-mint:
        href: vi/fhsc/openapi/mutual-funds/get-benchmark-operation
        metadata:
          sidebarTitle: "So sánh các chỉ số hoạt động (AUM / số nhà đầu tư / dòng tiền) của nhiều quỹ"
