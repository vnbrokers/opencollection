type: object
properties:
  totalCount:
    type: integer
    format: int64
    description: Tổng số bản ghi trả ra.
  pageSize:
    type: integer
    format: int64
    description: Số lượng phần tử 1 trang.
  pageIndex:
    type: integer
    format: int64
    description: Mục lục trang.
  data:
    type: array
    items:
      type: object
      properties:
        orderId:
          type: string
          description: Số hiệu lệnh.
        side:
          $ref: ../enums/StockOrderSide.yaml
        symbol:
          type: string
          description: Mã chứng khoán.
        quoteQtty:
          type: number
          format: double
          description: Khối lượng đặt.
        quotePrice:
          type: number
          format: double
          description: Giá đặt.
        tradeId:
          type: string
          description: Id lệnh khớp.
        qtty:
          type: number
          format: double
          description: Khối lượng khớp.
        price:
          type: number
          format: double
          description: Giá khớp.
        timeExec:
          type: string
          description: Thời điểm khớp.
