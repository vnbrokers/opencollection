info:
  name: quotesGetEtfOrderBook
  type: http
  seq: 34
http:
  method: GET
  url: "{{baseUrl}}/market/quotes/etfs/{{symbol}}/order-book"
  params:
    - name: symbol
      value: "{{symbol}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  Độ sâu bid/ask của 1 mã ETF. Trả 404 `ORDER_BOOK_NOT_SUPPORTED` nếu mã không có depth.
