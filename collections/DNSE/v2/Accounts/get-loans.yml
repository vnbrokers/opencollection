info:
  name: Lấy danh sách khoản vay
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/accounts/:accountNo/loans?marketType=STOCK&pageSize=20&pageIndex=0"
  params:
    - name: marketType
      value: STOCK
      type: query
      description: "Loại thị trường. Hiện tại chỉ hỗ trợ các khoản vay cơ sở."
    - name: disbursementFrom
      value: ""
      type: query
      description: "Ngày giải ngân bắt đầu (YYYY-MM-DD)"
    - name: disbursementTo
      value: ""
      type: query
      description: "Ngày giải ngân kết thúc (YYYY-MM-DD)"
    - name: dueDateFrom
      value: ""
      type: query
      description: "Ngày đến hạn bắt đầu (YYYY-MM-DD)"
    - name: dueDateTo
      value: ""
      type: query
      description: "Ngày đến hạn kết thúc (YYYY-MM-DD)"
    - name: pageSize
      value: "20"
      type: query
      description: "Số bản ghi trên mỗi trang"
    - name: pageIndex
      value: "0"
      type: query
      description: "Vị trí của trang hiện tại"
    - name: positionId
      value: ""
      type: query
      description: "Id vị thế"
    - name: accountNo
      value: "{{accountNo}}"
      type: path
      description: "Số tiểu khoản"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("response matches the schema", function () {
          const schema = {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "title": "GetLoansResponse",
            "type": "object",
            "properties": {
              "loans": {
                "type": "array",
                "items": {
                  "type": "object",
                  "properties": {
                    "id": {"type": "integer"},
                    "accountNo": {"type": "string"},
                    "positionId": {"type": "integer"},
                    "symbol": {"type": "string"},
                    "disbursementDate": {"type": "string"},
                    "dueDate": {"type": "string"},
                    "initialRate": {"type": "integer"},
                    "interestRate": {"type": "number"},
                    "overdueInterestRate": {"type": "number"},
                    "preferentialPeriod": {"type": "integer"},
                    "preferentialInterestRate": {"type": "integer"},
                    "principal": {"type": "integer"},
                    "remainPrincipal": {"type": "integer"},
                    "remainInterest": {"type": "integer"}
                  }
                }
              },
              "pagination": {
                "type": "object",
                "properties": {
                  "pageIndex": {"type": "integer"},
                  "pageSize": {"type": "integer"},
                  "totalRecords": {"type": "integer"},
                  "totalPages": {"type": "integer"}
                }
              }
            }
          }

          res.status === 200 && expect(res.body).to.have.jsonSchema(schema);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công - trả về danh sách khoản vay
    request:
      url: "{{baseUrl}}/accounts/{{accountNo}}/loans"
      method: GET
      headers:
        - name: Accept
          value: application/json
        - name: X-API-Key
          value: "{{apiKey}}"
        - name: X-Aux-Date
          value: ""
        - name: X-Signature
          value: ""
        - name: version
          value: "2026-09-10"
      params:
        - name: marketType
          value: STOCK
          type: query
        - name: accountNo
          value: "{{accountNo}}"
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "loans": [
              {
                "id": 8117,
                "accountNo": "0001179019",
                "positionId": 8426,
                "symbol": "ACB",
                "disbursementDate": "2026-09-10",
                "dueDate": "2026-12-09",
                "initialRate": 1,
                "interestRate": 0.115,
                "overdueInterestRate": 0.18,
                "preferentialPeriod": 0,
                "preferentialInterestRate": 0,
                "principal": 1191245,
                "remainPrincipal": 1191245,
                "remainInterest": 1501
              }
            ],
            "pagination": {
              "pageIndex": 0,
              "pageSize": 20,
              "totalRecords": 2,
              "totalPages": 1
            }
          }
  - name: 400 Response
    description: Yêu cầu không hợp lệ
    request:
      url: "{{baseUrl}}/accounts/{{accountNo}}/loans"
      method: GET
      headers:
        - name: X-API-Key
          value: "{{apiKey}}"
        - name: X-Aux-Date
          value: ""
        - name: X-Signature
          value: ""
        - name: version
          value: "2026-09-10"
      params:
        - name: accountNo
          value: "{{accountNo}}"
          type: path
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "",
            "message": "",
            "status": 0
          }
  - name: 500 Response
    description: Lỗi máy chủ
    request:
      url: "{{baseUrl}}/accounts/{{accountNo}}/loans"
      method: GET
      headers:
        - name: X-API-Key
          value: "{{apiKey}}"
        - name: X-Aux-Date
          value: ""
        - name: X-Signature
          value: ""
        - name: version
          value: "2026-09-10"
      params:
        - name: accountNo
          value: "{{accountNo}}"
          type: path
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "",
            "message": "",
            "status": 0
          }

docs: |-
  Lấy danh sách các khoản vay trên tiểu khoản theo bộ lọc. Hiện tại chỉ hỗ trợ các khoản vay cơ sở.

  Các tham số ngày dùng định dạng YYYY-MM-DD.
