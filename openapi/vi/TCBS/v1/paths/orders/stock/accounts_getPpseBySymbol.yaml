"get":
  operationId: accounts_getPpseBySymbol
  tags:
    - stock-orders
  "summary": "Lấy sức mua theo mã"
  "description": "Lấy sức mua theo mã cổ phiếu cụ thể."
  "parameters":
    - "name": "accountNo"
      "in": "path"
      "required": true
      "description": "Số tiểu khoản."
      "schema":
        "type": "string"
    - "name": "symbol"
      "in": "path"
      "required": true
      "description": "Mã chứng khoán, ví dụ FPT."
      "schema":
        "type": "string"
  responses:
    "401":
      $ref: ../../../components/responses/Unauthorized.yaml
    "200":
      description: Phản hồi thành công
      content:
        application/json:
          schema:
            $ref: ../../../components/schemas/orders/PpseBySymbolResponse.yaml
          example:
            pp0: 2057323960
            maxQtty: 15000
