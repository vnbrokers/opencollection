info:
  name: Đặt lệnh mới
  type: http
  seq: 2
http:
  method: POST
  url: "{{baseUrl}}/trading/oa/sub-accounts/{subAccountId}/orders"
  headers:
    - name: Content-Type
      value: application/json
    - name: device-id
      value: "{{deviceId}}"
  body:
    type: json
    data: |-
      {
        "sub_account": "120C000008.1",
        "side": "BUY",
        "symbol": "HPG",
        "quantity": 100,
        "type": "LIMIT",
        "limit_price": 25500,
        "market_price": null,
        "stock_type": "STOCK"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  > ⚠️ Endpoint đang ở giai đoạn **preview**.

  Đặt 1 lệnh mua hoặc bán mới cho `subAccountId`. Yêu cầu **Tier 2 HMAC
  đầy đủ** + `X-FH-BODYHASH` (do request có body) + `X-FH-2FA-TOKEN`
  (daily 2FA session).

  **Bắt buộc** truyền header `device-id` — định danh thiết bị đặt
  lệnh do client cung cấp (phục vụ tuân thủ quy định giao dịch).

  **Semantic quan trọng**: HTTP `200` không bảo đảm sàn đã chấp nhận
  lệnh. Đọc field `result[].code` — nếu non-null thì sàn từ chối (xem
  `result[].rejected_reason` và bảng `Order-level error codes` trong
  trang Errors). Sau khi đặt thành công, poll
  `GET /trading/v1/accounts/{subAccountId}/order-book/{orderId}` để
  theo dõi trạng thái khớp.

  **Quy tắc field giá**:
  - `type = LIMIT` → `limit_price` là số VND, `market_price = null`.
  - `type = MARKET` → `market_price` là enum (`ATC`, `MP`, …),
    `limit_price = null`.

  **Order type theo sàn**:
  - HOSE: `LO`, `MP`, `ATO`, `ATC`, `MTL`
  - HNX: `LO`, `MTL`, `MOK`, `MAK`, `PLO`, `ATC`
  - UPCOM / HCX: chỉ `LO`

  ORS auto-convert: HOSE `MP → MTL`; HNX `MAK → FAK`, `MOK → FOK`.

  **Request body**

  | Field | Type | Required | Description |
  | --- | --- | --- | --- |
  | `sub_account` | string | Có | Sub-account ID dạng extended (kèm hậu tố `.1` / `.6` …), khác với `subAccountId` ở path param. Lấy từ field `sub_account_ext` của response `GET /users/v1/users/{userId}/sub-accounts`. |
  | `side` | string | Có | Phía của lệnh: `BUY` là lệnh mua; `SELL` là lệnh bán. |
  | `symbol` | string | Có | Mã chứng khoán cần đặt lệnh. |
  | `quantity` | integer (int64) | Có | Số lượng cổ phiếu. Lô chẵn HOSE/HNX là bội số 100. Đặt 1..99 là lô lẻ và chỉ chấp nhận `type = LIMIT`. |
  | `type` | string | Có | Kiểu định giá khi đặt lệnh — quyết định field giá nào phải set trong request body. `LIMIT` dùng `limit_price`; `MARKET` dùng `market_price`. |
  | `limit_price` | integer (int64) \| null | Không | Giá đặt khi `type = LIMIT`, đơn vị **VND** (không nhân 1000). Để `null` khi `type = MARKET`. |
  | `market_price` | string \| null | Không | Mã loại lệnh thị trường khi `type = MARKET`. Để `null` khi `type = LIMIT`. |
  | `stock_type` | string | Không | Phân loại công cụ tài chính. Mặc định `STOCK` nếu bỏ trống. |
