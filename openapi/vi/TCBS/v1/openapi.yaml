    MarketFloor:
      $ref: "./components/schemas/enums/MarketFloor.yaml"
    InvestorType:
      $ref: "./components/schemas/enums/InvestorType.yaml"
    IntradayTimeWindow:
      $ref: "./components/schemas/enums/IntradayTimeWindow.yaml"
    IntradayTWindow:
      $ref: "./components/schemas/enums/IntradayTWindow.yaml"
    DerivativeGetType:
      $ref: "./components/schemas/enums/DerivativeGetType.yaml"
    DerivativeSide:
      $ref: "./components/schemas/enums/DerivativeSide.yaml"
    DerivativeConditionalOrderType:
      $ref: "./components/schemas/enums/DerivativeConditionalOrderType.yaml"
    DerivativeOrderTypeFilter:
      $ref: "./components/schemas/enums/DerivativeOrderTypeFilter.yaml"
    DerivativeOrderStatusFilter:
