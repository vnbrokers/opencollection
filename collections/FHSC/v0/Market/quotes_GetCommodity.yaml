info:
  name: Giá realtime hàng hoá
  type: http
  seq: 23
http:
  method: GET
  url: "{{baseUrl}}/market/quotes/commodities/{{symbol}}"
  params:
    - name: symbol
      value: "{{symbol}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  Dữ liệu realtime của 1 mã hàng hoá. `symbol` không phân biệt hoa thường.
