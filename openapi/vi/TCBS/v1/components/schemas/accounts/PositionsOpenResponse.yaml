type: object
properties:
  cmd:
    type: string
    description: Tên lệnh phản hồi.
  rc:
    type: string
    description: Mã kết quả, 1 = thành công.
  data:
    type: array
    description: Danh sách vị thế mở.
    items:
      type: object
      properties:
        symbol:
          type: string
          description: Mã hợp đồng.
        im:
          type: string
          description: Tỷ lệ ký quỹ.
        deliver:
          type: integer
          format: int64
          description: Số lượng vị thế SHORT.
        receive:
          type: integer
          format: int64
          description: Số lượng vị thế LONG.
        net:
          type: integer
          format: int64
          description: Vị thế mở (>0 = LONG, <0 = SHORT).
        side:
          type: string
          description: "Loại vị thế: L = Long, S = Short."
        lastPrice:
          type: number
          format: double
          description: Giá thị trường.
        imValue:
          type: number
          format: double
          description: Giá trị ký quỹ ban đầu.
        vmValue:
          type: number
          format: double
          description: Lãi/lỗ.
        mrValue:
          type: number
          format: double
          description: Giá trị ký quỹ yêu cầu.
        duedate:
          type: string
          description: Ngày đáo hạn.
        pc_remain:
          type: string
          description: "% lãi/lỗ vị thế mở."
