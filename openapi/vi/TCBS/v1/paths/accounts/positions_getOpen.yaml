      "in": "query"
      "required": true
      "description": "Số tài khoản lưu ký."
      "schema":
        "type": "string"
    - "name": "subAccountId"
      "in": "query"
      "required": true
      "description": "Tiểu khoản phái sinh."
      "schema":
        "type": "string"
  responses:
    "401":
      $ref: ../../components/responses/Unauthorized.yaml
    "200":
      description: Phản hồi thành công
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/accounts/PositionsOpenResponse.yaml
