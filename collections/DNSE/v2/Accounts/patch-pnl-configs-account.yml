docs: |-
  Cài đặt cấu hình chốt lời, cắt lỗ cho tiểu khoản giao dịch.

  Chỉ áp dụng cho giao dịch phái sinh và các vị thế mới mở sau khi cài đặt thành công.

  <h3 id="patchpnlconfigsaccount-parameters">Parameters</h3>

  |Name|In|Type|Required|Description|
  |---|---|---|---|---|
  |marketType|query|string|false|Loại thị trường, hiện chỉ hỗ trợ DERIVATIVE|
  |X-API-Key|header|string|false|API Key được cấp khi đăng ký dịch vụ|
  |X-Aux-Date|header|string|false|Thời gian thực hiện yêu cầu|
  |X-Signature|header|string|false|Chữ ký xác thực yêu cầu|
  |version|header|string|false|Phiên bản API|
  |trading-token|header|string|false|Token đặt lệnh|
  |body|body|object|false|Cấu hình chốt lời, cắt lỗ|
  |» takeProfit|body|object|false|Cấu hình chốt lời|
  |»» enabled|body|boolean|false|Bật/tắt chức năng chốt lời|
  |»» strategy|body|string|false|Chiến lược kích hoạt chốt lời|
  |»» rate|body|number|false|Tỷ lệ so với giá hòa vốn khi strategy = PNL_RATE|
  |»» deltaPrice|body|number|false|Mức chênh lệch giá khi strategy = DELTA_PRICE|
  |»» orderMethod|body|string|false|Phương thức đặt lệnh khi điều kiện được kích hoạt|
  |»» orderDeltaPrice|body|number|false|Biên độ giá đặt lệnh|
  |» stopLoss|body|object|false|Cấu hình cắt lỗ|
  |»» enabled|body|boolean|false|Bật/tắt chức năng cắt lỗ|
  |»» strategy|body|string|false|Chiến lược kích hoạt cắt lỗ|
  |»» rate|body|number|false|Tỷ lệ so với giá hòa vốn khi strategy = PNL_RATE|
  |»» deltaPrice|body|number|false|Mức chênh lệch giá khi strategy = DELTA_PRICE|
  |»» orderMethod|body|string|false|Phương thức đặt lệnh khi điều kiện được kích hoạt|
  |»» orderDeltaPrice|body|number|false|Biên độ giá đặt lệnh|
  |»» trailingEnabled|body|boolean|false|Bật/tắt cơ chế Trailing Stop|
  |accountNo|path|string|true|Số tiểu khoản giao dịch|

  #### Detailed descriptions

  **marketType**: Loại thị trường
  - DERIVATIVE: Phái sinh (chỉ hỗ trợ phái sinh)

  **»» strategy**: Chiến lược kích hoạt
  - PNL_RATE: Kích hoạt theo tỷ lệ %
  - DELTA_PRICE: Kích hoạt theo mức chênh lệch giá

  <h3 id="patchpnlconfigsaccount-responseschema">Response Schema</h3>

  |Name|Type|Required|Restrictions|Description|
  |---|---|---|---|---|
  |» accountNo|string|false|none|Số tiểu khoản chứng khoán|
  |» configs|object|false|none|Cấu hình chốt lời và cắt lỗ của tiểu khoản|
  |» createdDate|string(date-time)|false|none|Thời điểm cấu hình được tạo|
  |» modifiedDate|string(date-time)|false|none|Thời điểm cập nhật cấu hình gần nhất|
