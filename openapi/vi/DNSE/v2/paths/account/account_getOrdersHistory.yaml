get:
  operationId: account_getOrdersHistory
  summary: Lịch sử lệnh
  parameters:
    - $ref: ../../components/parameters/XApiKey.yaml
    - $ref: ../../components/parameters/XAuxDate.yaml
    - $ref: ../../components/parameters/XSignature.yaml
    - name: marketType
      in: query
      required: true
      description: "Loại thị trường \n- STOCK: Gói vay giao dịch cơ sở\n- DERIVATIVE: Gói vay giao dịch phái sinh\n- BOND: Giao dịch trái phiếu"
      deprecated: false
      schema:
        $ref: ../../components/schemas/enums/MarketType.yaml
      example: STOCK
    - name: from
      in: query
      required: true
      description: "Ngày bắt đầu (yyyy-mm-dd) \n- Thời gian tra cứu tối đa trong 1 năm tính từ ngày hiện tại"
      deprecated: false
      schema:
        type: string
      example: "2026-02-15"
    - name: to
      in: query
      required: true
      description: "Ngày kết thúc (yyyy-mm-dd) \n- Lớn hơn hoặc bằng ngày bắt đầu và không vượt quá ngày hiện tại"
      deprecated: false
      schema:
        type: string
      example: "2026-03-18"
  responses:
    "200":
      description: OK
      headers:
        Content-Length:
          $ref: ../../components/headers/ContentLength.yaml
        Date:
          $ref: ../../components/headers/Date.yaml
        Vary:
          $ref: ../../components/headers/Vary.yaml
        X-Ratelimit-Limit:
          $ref: ../../components/headers/XRateLimitLimit.yaml
        X-Ratelimit-Remaining:
          $ref: ../../components/headers/XRateLimitRemaining.yaml
        X-Ratelimit-Reset:
          $ref: ../../components/headers/XRateLimitReset.yaml
        X-Tyk-Api-Expires:
          deprecated: false
          schema: {}
          example: Thu, 02 Jan 3000 15:04:00 UTC
