info:
  name: Cấu hình chốt lời, cắt lỗ của tiểu khoản
  type: http
  seq: 11

http:
  method: GET
  url: "{{baseUrl}}/accounts/:accountNo/pnl-configs?marketType=DERIVATIVE"
  params:
    - name: marketType
      value: DERIVATIVE
      type: query
      description: "Loại thị trường, hiện chỉ hỗ trợ DERIVATIVE"
    - name: accountNo
      value: "{{accountNo}}"
      type: path
      description: "Số tiểu khoản giao dịch"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("response matches the schema", function () {
          const schema = {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "title": "AccountPnlConfigsResponse",
            "type": "object",
            "properties": {
              "accountNo": {
                "type": "string"
              },
              "configs": {
                "type": "object",
                "properties": {
                  "takeProfit": {
                    "type": "object",
                    "properties": {
                      "enabled": { "type": "boolean" },
                      "strategy": { "type": "string" },
                      "rate": { "type": "number" },
                      "deltaPrice": { "type": "number" },
                      "orderMethod": { "type": "string" },
                      "orderDeltaPrice": { "type": "number" }
                    }
                  },
                  "stopLoss": {
                    "type": "object",
                    "properties": {
                      "enabled": { "type": "boolean" },
                      "strategy": { "type": "string" },
                      "rate": { "type": "number" },
                      "deltaPrice": { "type": "number" },
                      "orderMethod": { "type": "string" },
                      "orderDeltaPrice": { "type": "number" },
                      "trailingEnabled": { "type": "boolean" }
                    }
                  }
                }
              },
              "createdDate": {
                "type": "string"
              },
              "modifiedDate": {
                "type": "string"
              }
            }
          }

          res.status === 200 && expect(res.body).to.have.jsonSchema(schema);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

