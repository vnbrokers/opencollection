info:
  name: Lịch sử giá hàng hoá
  type: http
  seq: 24
http:
  method: GET
  url: "{{baseUrl}}/market/quotes/commodities/{{symbol}}/history?resolution={{resolution}}&from={{from}}&to={{to}}"
  params:
    - name: symbol
      value: "{{symbol}}"
      type: path
    - name: resolution
      value: "{{resolution}}"
      type: query
    - name: from
      value: "{{from}}"
      type: query
    - name: to
      value: "{{to}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  Lịch sử giá OHLCV của 1 hàng hoá — chuỗi nến `{t, o, h, l, c, v}`. **Chỉ hỗ trợ `resolution=1D`**. `from`/`to` là Unix timestamp tính bằng **giây**.
