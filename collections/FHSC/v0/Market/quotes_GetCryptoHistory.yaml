info:
  name: quotesGetCryptoHistory
  type: http
  seq: 21
http:
  method: GET
  url: "{{baseUrl}}/market/quotes/cryptos/{{symbol}}/history?resolution={{resolution}}&from={{from}}&to={{to}}"
  params:
    - name: symbol
      value: "{{symbol}}"
      type: path
    - name: resolution
      value: "{{resolution}}"
      type: query
    - name: from
      value: "{{from}}"
      type: query
    - name: to
      value: "{{to}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  Lịch sử giá OHLCV của 1 crypto — chuỗi nến `{t, o, h, l, c, v}`. **Chỉ hỗ trợ `resolution=1D`**. `from`/`to` là Unix timestamp tính bằng **giây**.
