type: object
description: Một bản ghi lịch sử chỉ số thị trường.
properties:
  indexName:
    type: string
    description: Tên chỉ số thị trường.
  valueIndexes:
    type: number
    format: double
    description: Giá trị chỉ số.
  changedValue:
    type: number
    format: double
    description: Giá trị tăng hoặc giảm so với giá tham chiếu.
  changedRatio:
    type: number
    format: double
    description: Tỷ lệ phần trăm tăng hoặc giảm so với giá tham chiếu.
  fluctuationSteadinessIssueCount:
    type: integer
    description: Số lượng mã có giá không đổi.
  fluctuationDownIssueCount:
    type: integer
    description: Số lượng mã có giá giảm.
  fluctuationUpIssueCount:
    type: integer
    description: Số lượng mã có giá tăng.
  fluctuationLowerLimitIssueCount:
    type: integer
    description: Số lượng mã giảm sàn.
  fluctuationUpperLimitIssueCount:
    type: integer
    description: Số lượng mã tăng trần.
  fluctuationDownIssueVolume:
    type: integer
    format: int64
    description: Tổng khối lượng giao dịch các mã có giá giảm.
  fluctuationUpIssueVolume:
    type: integer
    format: int64
    description: Tổng khối lượng giao dịch các mã có giá tăng.
  fluctuationSteadinessIssueVolume:
    type: integer
    format: int64
    description: Tổng khối lượng giao dịch các mã có giá không đổi.
  currencyCode:
    type: string
    description: Đơn vị tiền tệ.
  indexTypeCode:
    type: string
    description: Mã loại chỉ số.
  lowestValueIndexes:
    type: number
    format: double
    description: Giá trị thấp nhất trong phiên.
  highestValueIndexes:
    type: number
    format: double
    description: Giá trị cao nhất trong phiên.
  priorValueIndexes:
    type: number
    format: double
    description: Giá trị tham chiếu.
  contauctAccTrdVal:
    type: number
    format: double
    description: Tổng giá trị giao dịch theo phương thức khớp lệnh.
  contauctAccTrdVol:
    type: integer
    format: int64
    description: Tổng khối lượng giao dịch theo phương thức khớp lệnh.
  blkTrdAccTrdVal:
    type: number
    format: double
    description: Tổng giá trị giao dịch theo phương thức thỏa thuận.
  blkTrdAccTrdVol:
    type: integer
    format: int64
    description: Tổng khối lượng giao dịch theo phương thức thỏa thuận.
  grossTradeAmount:
    type: number
    format: double
    description: Tổng giá trị giao dịch trong ngày.
  totalVolumeTraded:
    type: integer
    format: int64
    description: Tổng khối lượng giao dịch trong ngày.
  marketIndexClass:
    oneOf:
      - type: integer
      - type: string
    description: Phân loại chỉ số.
  marketId:
    type: string
    description: Mã thị trường.
  tradingSessionId:
    type: string
    description: Mã phiên giao dịch.
  time:
    type: string
    description: Thời điểm ghi nhận dữ liệu theo định dạng DNSE `YYYY-MM-DD HH:mm:ss.SSS`.
    pattern: '^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}(\.\d{3})?$'
