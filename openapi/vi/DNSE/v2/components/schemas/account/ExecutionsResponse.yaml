type: object
additionalProperties: true
properties:
  id:
    type: integer
    format: int32
    example: 1651
    description: ID lệnh
  side:
    allOf:
      - $ref: ../enums/OrderSide.yaml
    example: NB
    description: "Chiều giao dịch

      - NB: Mua

      - NS: Bán"
  accountNo:
    type: string
    example: "0001179019"
    description: Số tiểu khoản
  symbol:
    type: string
    example: HPG
    description: Mã chứng khoán
  price:
    type: integer
    format: int32
    example: 24250
    description: Giá đặt lệnh
  quantity:
    type: integer
    format: int32
    example: 500
    description: Khối lượng đặt lệnh
  orderType:
    allOf:
      - $ref: ../enums/OrderType.yaml
    example: LO
    description: "Loại lệnh

      - LO: Lệnh giới hạn

      - MOK/MAK/MTL: Lệnh thị trường

      - ATO/ATC: Lệnh phiên định kỳ mở cửa/đóng cửa

      - PLO: Lệnh khớp lệnh sau giờ"
  loanPackageId:
    type: integer
    format: int32
    example: 5757
    description: Mã gói vay
  orderCategory:
    allOf:
      - $ref: ../enums/OrderCategory.yaml
    example: NORMAL
    description: Phân loại lệnh (mặc định NORMAL)
  orderStatus:
    allOf:
      - $ref: ../enums/OrderStatus.yaml
    example: PartiallyFilled
    description: "Trạng thái lệnh

      - Pending/PendingNew: Chờ gửi

      - New: Chờ khớp

      - PartiallyFilled: Khớp một phần

      - Filled: Khớp toàn bộ

      - Rejected: Bị từ chối

      - Expired: Hết hạn trong phiên

      - DoneForDay: Lệnh được giải tỏa do không khớp trong phiên"
  fillQuantity:
    type: integer
    format: int32
    example: 200
    description: Khối lượng đã khớp
  lastQuantity:
    type: integer
    format: int32
    example: 100
    description: Khối lượng khớp gần nhất
  lastPrice:
    type: integer
    format: int32
    example: 24250
    description: Giá khớp gần nhất
  averagePrice:
    type: integer
    format: int32
    example: 24250
    description: Giá khớp trung bình
  transDate:
    type: string
    example: "2026-07-13"
    description: Ngày giao dịch
  taxRate:
    type: integer
    format: int32
    example: 0
    description: Tỷ lệ thuế
  exchangeFeeRate:
    type: number
    format: double
    example: 0.00027
    description: Tỷ lệ phí trả Sở giao dịch
  feeRate:
    type: number
    format: double
    example: 0.00027
    description: Tổng tỷ lệ phí của lệnh
  leaveQuantity:
    type: integer
    format: int32
    example: 300
    description: Khối lượng còn lại chưa khớp
  canceledQuantity:
    type: integer
    format: int32
    example: 0
    description: Khối lượng đã hủy
  error:
    type: string
    example: ""
    description: Mã lỗi nếu lệnh bị từ chối
  marketType:
    allOf:
      - $ref: ../enums/MarketType.yaml
    example: STOCK
    description: "Loại thị trường

      - STOCK: Lệnh cơ sở

      - DERIVATIVE: Lệnh phái sinh"
  priceSecure:
    type: integer
    format: int32
    example: 24250
    description: Giá dùng để kiểm tra sức mua/đặt lệnh
  createdDate:
    type: string
    format: date-time
    example: "2026-07-13T06:50:36.532741Z"
    description: Thời điểm tạo lệnh
  modifiedDate:
    type: string
    format: date-time
    example: "2026-07-13T06:50:59.052768Z"
    description: Thời điểm cập nhật lệnh
  metadata:
    type: string
    example: '{"orderSession":"OPEN","ip":"202.60.110.58","maker":"1000005917","isForeigner":false,"reqId":"24534","probType":"CUSTOMER_8000","eventNo":4.0}'
    description: Thông tin bổ sung của lệnh
  reports:
    type: array
    description: Danh sách trạng thái lệnh theo từng lần cập nhật
    example:
      - id: 1651
        side: NB
        accountNo: "0001179019"
        symbol: HPG
        price: 24250
        quantity: 500
        orderType: LO
        orderStatus: PartiallyFilled
        fillQuantity: 100
        lastQuantity: 100
        lastPrice: 24250
        averagePrice: 24250
        transDate: "2026-07-13"
        createdDate: "2026-07-13T06:50:36.532741Z"
        modifiedDate: "2026-07-13T06:50:51.613222Z"
        taxRate: 0
        exchangeFeeRate: 0
        feeRate: 0.00027
        leaveQuantity: 400
        canceledQuantity: 0
        error: ""
        priceSecure: 24250
        metadata: '{"orderSession":"OPEN","ip":"202.60.110.58","maker":"1000005917","isForeigner":false,"reqId":"24534","probType":"CUSTOMER_8000","eventNo":3}'
        loanPackageId: 5757
    items:
      $ref: ./ExecutionReport.yaml
