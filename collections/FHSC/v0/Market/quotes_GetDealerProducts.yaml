http:
  method: GET
  url: "{{baseUrl}}/market/quotes/commodities/{{symbol}}/dealer-products"
  params:
    - name: symbol
      value: "{{symbol}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  Danh sách báo giá dealer nội địa (VN) cho 1 hàng hoá — VD vàng SJC/PNJ/DOJI. Hàng hoá không có dealer trả mảng rỗng (200), không phải lỗi.
