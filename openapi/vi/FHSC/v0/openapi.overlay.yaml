  - target: "$.paths['/fund-trading/public/fund-certificates/top-investor'].get"
    update:
      x-mint:
        href: vi/fhsc/openapi/mutual-funds/get-top-funds-by-investors
        metadata:
          sidebarTitle: "Danh sách quỹ theo số nhà đầu tư"
  - target: "$.paths['/fund-trading/public/fund-certificates/top-fund-flow'].get"
    update:
      x-mint:
        href: vi/fhsc/openapi/mutual-funds/get-top-funds-by-flow
        metadata:
          sidebarTitle: "Danh sách quỹ theo dòng tiền ròng"
  - target: "$.paths['/fund-trading/public/fund-certificates/top-holding-symbols'].get"
    update:
      x-mint:
        href: vi/fhsc/openapi/mutual-funds/get-top-held-symbols
