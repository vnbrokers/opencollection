get:
  operationId: ticker_getCommons
  tags:
    - market
  summary: Thông tin mã, giá
  description: Lấy thông tin mã và giá của thị trường cơ sở.
  parameters:
    - name: tickers
      in: query
      required: false
      description: Danh sách mã cổ phiếu phân tách bằng dấu phẩy. Không dùng kết hợp với tham số index.
      schema:
        type: string
    - name: index
      in: query
      required: false
      description:
        "Rổ chứng khoán: 1 = HOSE, 2 = VN30, 3 = HNX, 4 = HNX30, 5 = UPCOM, 10 = Midcap, 11 = VN100, 12 = VNAllShare,
        13 = VNSmallCap, 14 = VNXAllShare, 15 = VN50, 16 = VNSI. Không dùng kết hợp với tham số tickers."
      schema:
        type: number
        format: double
  responses:
    "401":
      $ref: ../../components/responses/Unauthorized.yaml
    "200":
      description: Phản hồi thành công
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/market/TickerCommonsResponse.yaml
          example:
            data:
              - symbol: FPT
                ceilPrice: 106100
                floorPrice: 92300
                refPrice: 99200
                bidPrice01: 98700
                bidPrice02: 98600
                bidPrice03: 98500
                bidQtty01: 11300
                bidQtty02: 56800
                bidQtty03: 45600
                offerPrice01: 98800
                offerPrice02: 98900
                offerPrice03: 99000
                offerQtty01: 100
                offerQtty02: 23200
                offerQtty03: 56100
                matchPrice: 98800
                matchQtty: 100
                change: -400
                changePercent: -0.4032
                open: 99200
                avg: 98800
                high: 99200
                low: 98500
