info:
  name: Gói lãi suất margin
  type: http
  seq: 8
  tags:
    - accounts
http:
  method: GET
  url: "{{baseUrl}}/hydros/v1/account/:accountNo/pricing-policy"
  params:
    - name: accountNo
      value: "{{accountNo}}"
      type: path
      description: Số tiểu khoản margin
    - name: productId
      value: "1"
      type: query
      description: Product ID (tùy chọn)
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/hydros/v1/account/:accountNo/pricing-policy?productId=1"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": []
          }
