info:
  name: stocksGetOwnership
  type: http
  seq: 42
http:
  method: GET
  url: "{{baseUrl}}/market/stocks/{{symbol}}/ownership"
  params:
    - name: symbol
      value: "{{symbol}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  Cơ cấu sở hữu hiện tại của 1 mã: tỷ lệ nhà nước / nước ngoài / khác, danh sách cổ đông lớn và tóm tắt room ngoại. Đây là trạng thái hiện tại, không phải lịch sử giao dịch.
