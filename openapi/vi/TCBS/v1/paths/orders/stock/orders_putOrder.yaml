put:
  operationId: orders_putOrder
  tags:
    - stock-orders
  summary: Sửa lệnh cổ phiếu
  description: Cập nhật giá hoặc khối lượng của lệnh.
  parameters:
    - name: accountNo
      in: path
      required: true
      description: "Số tiểu khoản."
      schema:
        type: string
    - name: orderId
      in: path
      required: true
      description: "Order ID."
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            price:
              type: integer
              format: int64
              description: "Giá giao dịch mới."
            quantity:
              type: integer
              format: int64
              description: "Khối lượng giao dịch mới."
          required:
            - price
            - quantity
  responses:
    "401":
      $ref: ../../../components/responses/Unauthorized.yaml
    "200":
      description: Phản hồi thành công
      content:
        application/json:
          schema:
            $ref: ../../../components/schemas/orders/OrderPutResponse.yaml
          example:
            error: "0"
            message: Sửa lệnh thành công!
            orderId: "9202205230000324355"
