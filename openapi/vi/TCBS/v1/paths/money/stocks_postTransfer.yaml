"post":
  operationId: stocks_postTransfer
  tags:
    - cash
  "summary": "Chuyển tiền nội bộ"
  "description": "Chuyển tiền giữa các tiểu khoản."
  responses:
    "401":
      $ref: ../../components/responses/Unauthorized.yaml
    "200":
      description: Phản hồi thành công
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/money/StockTransferResponse.yaml
          example:
            code: "200"
            message: OK

  "requestBody":
    "required": true
    "content":
      "application/json":
        "schema":
          "type": "object"
          "properties":
            "sourceAccountNumber":
              "type": "string"
              "description": "Source Số tiểu khoản."
            "destinationAccountNumber":
              "type": "string"
              "description": "Destination Số tiểu khoản."
            "amount":
              "type": "number"
              "format": "double"
              "description": "Transfer Số tiền."
            "description":
              "type": "string"
              "description": "Transfer Mô tả."
          "required":
            - "sourceAccountNumber"
            - "destinationAccountNumber"
            - "amount"
            - "description"
