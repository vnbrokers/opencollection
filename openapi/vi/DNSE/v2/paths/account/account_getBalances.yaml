get:
  operationId: account_getBalances
  summary: Thông tin tiền
  parameters:
    - $ref: ../../components/parameters/XApiKey.yaml
    - $ref: ../../components/parameters/XAuxDate.yaml
    - $ref: ../../components/parameters/XSignature.yaml
  responses:
    "200":
      description: OK
      headers:
        Access-Control-Allow-Credentials:
          $ref: ../../components/headers/AccessControlAllowCredentials.yaml
        Access-Control-Allow-Headers:
          deprecated: false
          schema: {}
          example: Content-Type, Authorization, X-Request-ID, Accept, Origin, X-Requested-With
        Access-Control-Allow-Methods:
          deprecated: false
          schema: {}
          example: GET, POST, PUT, DELETE, OPTIONS, PATCH
        Access-Control-Allow-Origin:
          deprecated: false
          schema: {}
          example: "*"
        Access-Control-Max-Age:
          deprecated: false
          schema: {}
          example: "86400"
        Content-Length:
          $ref: ../../components/headers/ContentLength.yaml
        Date:
          $ref: ../../components/headers/Date.yaml
        Vary:
          $ref: ../../components/headers/Vary.yaml
        X-Ratelimit-Limit:
          $ref: ../../components/headers/XRateLimitLimit.yaml
        X-Ratelimit-Remaining:
          $ref: ../../components/headers/XRateLimitRemaining.yaml
        X-Ratelimit-Reset:
          $ref: ../../components/headers/XRateLimitReset.yaml
        X-Request-Id:
          $ref: ../../components/headers/XRequestId.yaml
        X-Tyk-Api-Expires:
          deprecated: false
          schema: {}
          example: Thu, 02 Jan 3000 15:04:00 UTC
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/account/BalancesResponse.yaml
          example:
            stock:
              totalCash: 3720308
              availableCash: 3720022
              depositInterest: 286
              totalDebt: 592355
              depositFeeAmount: 405
              withdrawableCash: 3719617
              cashDividendReceiving: 0
            derivative:
              pendingDepositWithdraw: 826996062
              remainSecure: 122363429600
              usedSecure: 102098277
              pendingSecure: 826996062
              holdTaxAndFee: 0
              totalLoanDebt: 0
    "400":
      $ref: ../../components/responses/BadRequest.yaml
    "500":
      $ref: ../../components/responses/InternalError.yaml
  tags:
    - account
parameters:
  - name: accountNo
    in: path
    required: true
    description: Số tiểu khoản
    deprecated: false
    schema:
      type: string
    example: "0001179019"
