http:
  method: GET
  url: "{{baseUrl}}/price/:indexName/market-index?from=1788915600&to=1788922800&limit=100&nextPageToken="
  params:
    - name: from
      value: "1788915600"
      type: query
      description: "Thời gian bắt đầu (timestamp)"
    - name: to
      value: "1788922800"
      type: query
      description: "Thời gian kết thúc (timestamp)"
    - name: limit
      value: "100"
      type: query
      description: "Số lượng bản ghi tối đa trả về"
    - name: nextPageToken
      value: ""
      type: query
      description: "Token dùng để lấy trang tiếp theo"
    - name: indexName
      value: "{{indexName}}"
      type: path
      description: "Tên chỉ số thị trường"
  auth: inherit

