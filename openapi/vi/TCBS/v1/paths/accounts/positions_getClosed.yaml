"get":
  operationId: positions_getClosed
  tags:
    - account
  "summary": "Tài sản, vị thế đóng"
  "description": "Tra cứu danh sách vị thế đã đóng của tài khoản phái sinh."
  "parameters":
    - "name": "accountId"
      "in": "query"
      "required": true
      "description": "Số tài khoản lưu ký."
      "schema":
        "type": "string"
    - "name": "subAccountId"
      "in": "query"
      "required": true
      "description": "Tiểu khoản phái sinh."
      "schema":
        "type": "string"
    - "name": "symbol"
      "in": "query"
      "required": false
      "description": "Mã cổ phiếu (empty = all)."
      "schema":
        "type": "string"
    - "name": "pageNo"
      "in": "query"
      "required": true
      "description": "Số trang."
      "schema":
        "type": "number"
        "format": "double"
    - "name": "pageSize"
      "in": "query"
      "required": true
      "description": "Kích thước trang."
      "schema":
        "type": "number"
        "format": "double"
  responses:
    "401":
      $ref: ../../components/responses/Unauthorized.yaml
    "200":
      description: Phản hồi thành công
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/accounts/PositionsClosedResponse.yaml
          example:
            cmd: Web.Portfolio.PositionClose
            rc: "1"
            data:
              - symbol: TOTAL
                side: ""
                openPrice: 0
                closePrice: 0
                closePosition: "0"
                fee: 11400
                tax: 15275
                closeVM: 500000
                unrealize: 500000
                closePC: 0
                time: ""
              - symbol: VN30F2103
                side: S
                openPrice: 1180
                closePrice: 1175
                closePosition: 1/1
                fee: 5700
                tax: 7637.5
                closeVM: 500000
                unrealize: 0
                closePC: 3.26
                time: 11:56:24
