"get":
  operationId: orders_getInDay
  tags:
    - derivative-orders
  "summary": "Tra cứu sổ lệnh thường phái sinh"
  "description": "Tra cứu sổ lệnh thường phái sinh."
  "parameters":
    - "name": "accountId"
      "in": "query"
      "required": true
      "description": "Số tài khoản lưu ký."
      "schema":
        "type": "string"
    - "name": "pageNo"
      "in": "query"
      "required": true
      "description": "Số trang."
      "schema":
        "type": "number"
        "format": "double"
    - "name": "pageSize"
      "in": "query"
      "required": true
      "description": "Kích thước trang."
      "schema":
        "type": "number"
        "format": "double"
    - "name": "symbol"
      "in": "query"
      "required": true
      "description": "Bộ lọc: ALL,ALL = all; VN30F2303,B = by mã; ALL,B = by L/S."
      "schema":
        "type": "string"
    - "name": "orderType"
      "in": "query"
      "required": true
      "description": "Bộ lọc Loại lệnh: '' = all, 3 = Arbitrage, 4 = SL/TP, 5 = ForceClose, 6 = Thường."
      "schema":
        "$ref": "../../../components/schemas/enums/DerivativeOrderTypeFilter.yaml"
    - "name": "status"
      "in": "query"
      "required": true
      "description": "0 = all, 1 = waiting, 2 = matched."
      "schema":
        "$ref": "../../../components/schemas/enums/DerivativeOrderStatusFilter.yaml"
    - "name": "refId"
      "in": "query"
      "required": false
      "description": "Ref ID của lệnh."
      "schema":
        "type": "string"
  responses:
    "401":
      $ref: ../../../components/responses/Unauthorized.yaml
    "200":
      description: Phản hồi thành công
      content:
        application/json:
          schema:
            $ref: ../../../components/schemas/orders/DerivativeOrdersInDayResponse.yaml
          example:
            cmd: "Web.Order.IndayOrder"
            rc: "1"
            data:
              - orderNo: "37"
                pk_orderNo: "7625908"
                refId: "H.7387641765855363489"
                orderTime: "13:34:47"
                accountCode: "000112A"
                side: "S"
                symbol: "VN30F2303"
                volume: 1
                showPrice: "MTL (1198)"
                matchVolume: 1
                status: "PM"
                orderStatus: "4"
                channel: "I"
                group: "FU"
                isCancel: "0"
                isAmend: "0"
                orderType: "N"
                source: "SYS"
