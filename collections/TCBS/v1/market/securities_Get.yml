info:
  name: Tra cứu thông tin chứng khoán
  type: http
  seq: 10
  tags:
    - market
http:
  method: GET
  url: "{{baseUrl}}/ananke/v1/securities"
  params:
    - name: fields
      value: all
      type: query
      description: Các trường cần trả về (mặc định all)
    - name: filter
      value: symbol=TCB
      type: query
      description: Bộ lọc theo cú pháp trường=giá trị
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/ananke/v1/securities?fields=all&filter=symbol%3DTCB"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "content": [],
            "totalElements": 0,
            "totalPages": 0,
            "size": 1000,
            "number": 0,
            "first": true,
            "last": true
          }
