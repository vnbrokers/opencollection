"put":
  operationId: orders_putCancelOrders
  tags:
    - stock-orders
  "summary": "Hủy lệnh thường"
  "description": "Huỷ một hoặc nhiều lệnh chưa khớp hết bằng danh sách order ID."
  "parameters":
    - "name": "accountNo"
      "in": "path"
      "required": true
      "description": "Số tiểu khoản."
      "schema":
        "type": "string"
  responses:
    "401":
      $ref: ../../../components/responses/Unauthorized.yaml
    "200":
      description: Phản hồi thành công
      content:
        application/json:
          schema:
            $ref: ../../../components/schemas/orders/OrdersCancelResponse.yaml
          example:
            error: "0"
            message: Huỷ lệnh thành công!

  "requestBody":
    "required": true
    "content":
      "application/json":
        "schema":
          "type": "object"
          "properties":
            "ordersList":
              "type": "array"
              "items":
                "type": "object"
              "description": "Danh sách lệnh cần hủy."
          "required":
            - "ordersList"
        example:
          ordersList:
            - orderID: "9202205230000324355"
