info:
  name: Lịch sử giá cổ phiếu
  type: http
  seq: 12
http:
  method: GET
  url: "{{baseUrl}}/market/quotes/stocks/{{symbol}}/history?resolution={{resolution}}&from={{from}}&to={{to}}"
  params:
    - name: symbol
      value: "{{symbol}}"
      type: path
    - name: resolution
      value: "{{resolution}}"
      type: query
    - name: from
      value: "{{from}}"
      type: query
    - name: to
      value: "{{to}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  Lịch sử giá OHLCV của 1 mã cổ phiếu — chuỗi nến `{t, o, h, l, c, v}`. Cổ phiếu VN hỗ trợ mọi `resolution`; cổ phiếu Mỹ (vd AAPL) **chỉ hỗ trợ `1D`**. `from`/`to` là Unix timestamp tính bằng **giây**.
