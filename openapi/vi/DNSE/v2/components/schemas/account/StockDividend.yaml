type: object
properties:
  id:
    type: integer
    example: 618949
    description: ID sự kiện quyền
    format: int32
  symbol:
    type: string
    example: OIL
    description: Mã chứng khoán
  caStatus:
    allOf:
      - $ref: ../enums/CorporateActionStatus.yaml
    example: pending
    description: "Trạng thái xử lý sự kiện quyền

      - pending: Quyền đang chờ xử lý hoặc đang được thực hiện

      - completed: Quyền đã được xử lý hoàn tất

      - canceled: Quyền đã hủy thành công"
  recordDate:
    type: string
    example: "2026-04-29"
    description: Ngày đăng ký cuối cùng sự kiện quyền
  processDate:
    type: string
    example: "2026-05-14"
    description: Ngày phân phối cổ phiếu cổ tức dự kiến
  holdingQuantity:
    type: integer
    example: 3211
    description: Số lượng chứng khoán sở hữu tại ngày chốt quyền
    format: int32
  ratio:
    type: string
    example: 5/3
    description: Tỷ lệ thực hiện quyền nhận cổ tức bằng cổ phiếu
  receivedQuantity:
    type: integer
    example: 1926
    description: Số lượng cổ phiếu cổ tức được nhận
    format: int32
