info:
  name: Lịch sử giá forex
  type: http
  seq: 18
http:
  method: GET
  url: "{{baseUrl}}/market/quotes/forex/{{symbol}}/history?resolution={{resolution}}&from={{from}}&to={{to}}"
  params:
    - name: symbol
      value: "{{symbol}}"
      type: path
    - name: resolution
      value: "{{resolution}}"
      type: query
    - name: from
      value: "{{from}}"
      type: query
    - name: to
      value: "{{to}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  Lịch sử tỷ giá 1 cặp forex — chuỗi nến close-only (`c`, các field khác null). `resolution` mặc định `1D`. `from`/`to` là Unix timestamp tính bằng **giây**.
