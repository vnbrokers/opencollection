info:
  name: Cài đặt chốt lời, cắt lỗ cho tiểu khoản
  type: http
  seq: 12

http:
  method: PATCH
  url: "{{baseUrl}}/accounts/:accountNo/pnl-configs?marketType=DERIVATIVE"
  headers:
    - name: trading-token
      value: "{{tradingToken}}"
      description: "Token đặt lệnh."
  params:
    - name: marketType
      value: DERIVATIVE
      type: query
      description: "Loại thị trường, hiện chỉ hỗ trợ DERIVATIVE"
    - name: accountNo
      value: "{{accountNo}}"
      type: path
      description: "Số tiểu khoản giao dịch"
  body:
    type: json
    data: |-
      {
        "takeProfit": {
          "enabled": true,
          "strategy": "DELTA_PRICE",
          "rate": 0.52,
          "deltaPrice": 162.8,
          "orderMethod": "FASTEST",
          "orderDeltaPrice": 2
        },
        "stopLoss": {
          "enabled": true,
          "strategy": "PNL_RATE",
          "rate": -0.34,
          "deltaPrice": 50.3,
          "orderMethod": "DELTA_PRICE",
          "orderDeltaPrice": 10.5,
          "trailingEnabled": true
        }
      }
  auth: inherit

runtime:
