get:
  operationId: quotesGetDealerProductHistory
  tags:
    - market-data

  summary: Lịch sử giá sản phẩm dealer
  description: Lịch sử giá của 1 sản phẩm dealer theo `code`. `from`/`to` là Unix timestamp tính bằng **giây**.
  parameters:
    - name: symbol
      in: path
      required: true
      description: "Mã hàng hoá ISO. VD: XAU (vàng), XAG (bạc), CL (dầu)."
      schema:
        type: string
        example: XAU
    - name: code
      in: path
      required: true
      description: Mã sản phẩm dealer (VD nhãn hiệu/loại vàng miếng).
      schema:
        type: string
        example: SJC-1L
    - name: from
      in: query
      required: true
      description: Thời điểm bắt đầu, Unix timestamp tính bằng **giây**.
      schema:
        type: integer
        minimum: 0
        example: 1717200000
    - name: to
      in: query
      required: true
      description: Thời điểm kết thúc, Unix timestamp tính bằng **giây**.
      schema:
        type: integer
        minimum: 0
        example: 1717545600
  responses:
    "200":
      description: "`data.series` là chuỗi điểm giá."
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/market/QuoteDealerProductHistoryResponse.yaml"
    "400":
      $ref: "../../components/responses/BadRequest.yaml"
    "401":
      $ref: "../../components/responses/Unauthorized.yaml"
    "404":
      $ref: "../../components/responses/NotFound.yaml"
    "429":
      $ref: "../../components/responses/RateLimited.yaml"
    "500":
      $ref: "../../components/responses/InternalError.yaml"
  x-codeSamples:
    - lang: bash
      label: cURL
      source: |
        curl -H "X-FH-APIKEY: $FINHAY_API_KEY" \
          "https://open-api.fhsc.com.vn/market/quotes/commodities/XAU/dealer-products/SJC-1L/history?from=1717200000&to=1717545600"
