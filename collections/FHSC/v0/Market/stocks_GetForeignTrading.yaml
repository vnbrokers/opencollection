info:
  name: stocksGetForeignTrading
  type: http
  seq: 48
http:
  method: GET
  url: "{{baseUrl}}/market/stocks/{{symbol}}/trading/foreign?date={{date}}"
  params:
    - name: symbol
      value: "{{symbol}}"
      type: path
    - name: date
      value: "{{date}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  Giá trị và khối lượng mua / bán / ròng của khối ngoại với 1 mã trong một phiên, tách theo phương thức (khớp lệnh / thoả thuận).

  Khác với room ngoại (`/market/stocks/{symbol}/ownership/foreign-room`) — cái đó là trần sở hữu và phần room còn lại, không phải mua bán trong phiên.
