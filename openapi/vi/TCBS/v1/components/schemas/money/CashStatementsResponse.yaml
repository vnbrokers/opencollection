type: object
properties:
  response:
    type: object
    properties:
      pageIndex:
        type: integer
        format: int64
        description: Page index.
      pageSize:
        type: integer
        format: int64
        description: Page size.
      totalCreditAmount:
        type: integer
        format: int64
        description: Tổng tiền ghi có.
      totalDebitAmount:
        type: integer
        format: int64
        description: Tổng phát sinh tăng.
      totalCount:
        type: integer
        format: int64
        description: Tổng số bản ghi.
      data:
        type: array
        items:
          type: object
          properties:
            custodyID:
              type: string
              description: Số tài khoản.
            transactionCode:
              type: string
              description: Loại giao dịch.
            transactionName:
              type: string
              description: Tên loại giao dịch.
            debitAmount:
              type: number
              format: double
              description: Số tiền phát sinh tăng.
            creditAmount:
              type: number
              format: double
              description: Số tiền phát sinh giảm.
            businessDate:
              type: string
              description: Ngày làm việc.
            transactionDate:
              type: string
              description: Ngày giao dịch.
            transactionNum:
              type: string
              description: Số giao dịch.
            accountNo:
              type: string
              description: Số tiểu khoản.
            descriptions:
              type: string
              description: Mô tả.
