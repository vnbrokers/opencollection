"get":
  operationId: profiles_getByCustodyCode
  tags:
    - account
  "summary": "Thông tin tiểu khoản"
  "description": "Lấy thông tin hồ sơ của một tài khoản lưu ký theo danh sách trường yêu cầu."
  "parameters":
    - "name": "custodyCode"
      "in": "path"
      "required": true
      "description": "Số tài khoản lưu ký, ví dụ: 105C334455."
      "schema":
        "type": "string"
    - "name": "fields"
      "in": "query"
      "required": true
      "description": "Danh sách thông tin cần lấy, ví dụ: basicInfo, bankSubAccounts."
      "schema":
        "type": "string"
  responses:
    "401":
      $ref: ../../components/responses/Unauthorized.yaml
    "200":
      description: Phản hồi thành công
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/accounts/ProfileResponse.yaml
