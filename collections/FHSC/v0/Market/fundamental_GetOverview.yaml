info:
  name: fundamentalGetOverview
  type: http
  seq: 3
http:
  method: GET
  url: "{{baseUrl}}/market/company-financial/overview?symbol={{symbol}}"
  params:
    - name: symbol
      value: "{{symbol}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  Các chỉ số tài chính quan trọng của 1 mã stock. `industry` chứa giá trị
  trung bình của ngành cho cùng bộ chỉ số. `nim` chỉ có ý nghĩa với ngân
  hàng; `margin_loan_to_equity_ratio` chỉ có với công ty chứng khoán.
