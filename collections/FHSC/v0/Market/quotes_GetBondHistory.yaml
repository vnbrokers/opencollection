info:
  name: Lịch sử giá trái phiếu
  type: http
  seq: 31
http:
  method: GET
  url: "{{baseUrl}}/market/quotes/bonds/{{symbol}}/history?resolution={{resolution}}&from={{from}}&to={{to}}"
  params:
    - name: symbol
      value: "{{symbol}}"
      type: path
    - name: resolution
      value: "{{resolution}}"
      type: query
    - name: from
      value: "{{from}}"
      type: query
    - name: to
      value: "{{to}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  Lịch sử giá OHLCV của 1 mã trái phiếu — chuỗi nến `{t, o, h, l, c, v}`. `from`/`to` là Unix timestamp tính bằng **giây**. Với trái phiếu Chính phủ (VN10Y, US10Y, JP10Y, DE10Y): mỗi điểm chỉ có `{t, yield}` (lợi suất %) và luôn ở độ phân giải `1D`.
