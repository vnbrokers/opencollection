info:
  name: stocksGetTrading
  type: http
  seq: 46
http:
  method: GET
  url: "{{baseUrl}}/market/stocks/{{symbol}}/trading?date={{date}}"
  params:
    - name: symbol
      value: "{{symbol}}"
      type: path
    - name: date
      value: "{{date}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  Khối lượng và giá trị giao dịch của 1 mã trong một phiên, tách theo phương thức: `matched` (khớp lệnh) + `put_through` (thoả thuận) = `total`.

  Khác với giá: đây là dòng giao dịch, không phải OHLCV — giá xem ở `/market/quotes/stocks/{symbol}`.
