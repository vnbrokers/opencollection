get:
  operationId: stocksGetForeignRoomHistory
  tags:
    - market-data

  summary: Lịch sử room ngoại
  description: |
    Chuỗi room ngoại theo ngày của 1 mã. `from`/`to` phải truyền cùng nhau (dạng `YYYY-MM-DD`, khoảng tối đa 5 năm); bỏ trống cả hai → 3 tháng gần nhất. Kết quả phân trang, `total` là tổng số phiên trong khoảng.
  parameters:
    - name: symbol
      in: path
      required: true
      description: "Mã cổ phiếu niêm yết (3–10 ký tự chữ/số, không phân biệt hoa thường). VD: VNM, FPT."
      schema:
        type: string
        example: VNM
    - name: from
      in: query
      required: false
      description: Ngày bắt đầu (bao gồm), dạng `YYYY-MM-DD`. Phải đi kèm `to`.
      schema:
        type: string
        format: date
        example: "2026-01-01"
    - name: to
      in: query
      required: false
      description: Ngày kết thúc (bao gồm), dạng `YYYY-MM-DD`. Phải đi kèm `from`, và không sớm hơn `from`.
      schema:
        type: string
        format: date
        example: "2026-03-31"
    - name: resolution
      in: query
      required: false
      description: Độ phân giải của bar. Hiện chỉ hỗ trợ `1D`.
      schema:
        type: string
        enum:
          - 1D
        example: 1D
    - name: page
      in: query
      required: false
      description: Trang, bắt đầu từ 1. Mặc định 1.
      schema:
        type: integer
        minimum: 1
        example: 1
    - name: page_size
      in: query
      required: false
      description: Số phiên mỗi trang (1–50). Mặc định 20.
      schema:
        type: integer
        minimum: 1
        maximum: 50
        example: 20
  responses:
    "200":
      description: "`data.items` là chuỗi room ngoại theo phiên."
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/market/ForeignRoomHistoryResponse.yaml"
    "400":
      $ref: "../../components/responses/BadRequest.yaml"
    "401":
      $ref: "../../components/responses/Unauthorized.yaml"
    "404":
      $ref: "../../components/responses/NotFound.yaml"
    "429":
      $ref: "../../components/responses/RateLimited.yaml"
    "500":
      $ref: "../../components/responses/InternalError.yaml"
  x-codeSamples:
    - lang: bash
      label: cURL
      source: |
        curl -H "X-FH-APIKEY: $FINHAY_API_KEY" \
          "https://open-api.fhsc.com.vn/market/stocks/VNM/ownership/foreign-room/history?from=2026-01-01&to=2026-03-31"
