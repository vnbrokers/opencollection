info:
  name: quotesGetStock
  type: http
  seq: 10
http:
  method: GET
  url: "{{baseUrl}}/market/quotes/stocks/{{symbol}}"
  params:
    - name: symbol
      value: "{{symbol}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  Dữ liệu realtime của 1 mã cổ phiếu. `symbol` không phân biệt hoa thường.
