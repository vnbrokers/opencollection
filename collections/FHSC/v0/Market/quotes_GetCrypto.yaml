info:
  name: Giá realtime crypto
  type: http
  seq: 20
http:
  method: GET
  url: "{{baseUrl}}/market/quotes/cryptos/{{symbol}}"
  params:
    - name: symbol
      value: "{{symbol}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  Dữ liệu realtime của 1 mã crypto. `symbol` không phân biệt hoa thường.
