"post":
  operationId: orders_postOrder
  tags:
    - stock-orders
  "summary": "Đặt lệnh thường"
  "description": "Đặt lệnh thường trên thị trường cơ sở."
  "parameters":
    - "name": "accountNo"
      "in": "path"
      "required": true
      "description": "Số tiểu khoản, ví dụ 0001170730."
      "schema":
        "type": "string"
  responses:
    "401":
      $ref: ../../../components/responses/Unauthorized.yaml
    "200":
      description: Phản hồi thành công
      content:
        application/json:
          schema:
            $ref: ../../../components/schemas/orders/OrderPostResponse.yaml
          example:
            error: "0"
            message: Đặt lệnh thành công!
            orderId: "9202205230000324355"

  "requestBody":
    "required": true
    "content":
      "application/json":
        "schema":
          "type": "object"
          "properties":
            "execType":
              "allOf":
                - "$ref": "../../../components/schemas/enums/StockOrderDirection.yaml"
              "description": "Chiều giao dịch: NS = bán, NB = mua."
            "symbol":
              "type": "string"
              "description": "Mã chứng khoán, ví dụ VNM."
            "priceType":
              "allOf":
                - "$ref": "../../../components/schemas/enums/StockPriceType.yaml"
              "description": "Loại giá: LO, ATO, ATC, PLO, MP, MTL, MOK, MAK."
            "price":
              "type": "integer"
              "format": "int64"
              "description": "Giá giao dịch."
            "quantity":
              "type": "integer"
              "format": "int64"
              "description": "Khối lượng giao dịch."
          "required":
            - "execType"
            - "symbol"
            - "priceType"
            - "price"
            - "quantity"
        example:
          execType: NB
          symbol: VNM
          priceType: LO
          price: 10000
          quantity: 100
