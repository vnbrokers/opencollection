info:
  name: ordersPlace
  type: http
  seq: 2
http:
  method: POST
  url: "{{baseUrl}}/trading/oa/sub-accounts/{subAccountId}/orders"
  headers:
    - name: Content-Type
      value: application/json
    - name: device-id
      value: "{{deviceId}}"
  body:
    type: json
    data: "{}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  > ⚠️ Endpoint đang ở giai đoạn **preview**.

  Đặt 1 lệnh mua hoặc bán mới cho `subAccountId`. Yêu cầu **Tier 2 HMAC
  đầy đủ** + `X-FH-BODYHASH` (do request có body) + `X-FH-2FA-TOKEN`
  (daily 2FA session).

  **Bắt buộc** truyền header `device-id` — định danh thiết bị đặt
  lệnh do client cung cấp (phục vụ tuân thủ quy định giao dịch).

  **Semantic quan trọng**: HTTP `200` không bảo đảm sàn đã chấp nhận
  lệnh. Đọc field `result[].code` — nếu non-null thì sàn từ chối (xem
  `result[].rejected_reason` và bảng `Order-level error codes` trong
  trang Errors). Sau khi đặt thành công, poll
  `GET /trading/v1/accounts/{subAccountId}/order-book/{orderId}` để
  theo dõi trạng thái khớp.

  **Quy tắc field giá**:
  - `type = LIMIT` → `limit_price` là số VND, `market_price = null`.
  - `type = MARKET` → `market_price` là enum (`ATC`, `MP`, …),
    `limit_price = null`.

  **Order type theo sàn**:
  - HOSE: `LO`, `MP`, `ATO`, `ATC`, `MTL`
  - HNX: `LO`, `MTL`, `MOK`, `MAK`, `PLO`, `ATC`
  - UPCOM / HCX: chỉ `LO`

  ORS auto-convert: HOSE `MP → MTL`; HNX `MAK → FAK`, `MOK → FOK`.
