info:
  name: Đảo vị thế
  type: http
  seq: 24

http:
  method: POST
  url: "{{baseUrl}}/positions/:positionId/reverse?marketType=DERIVATIVE"
  headers:
    - name: trading-token
      value: "{{tradingToken}}"
      description: "Token đặt lệnh."
  params:
    - name: marketType
      value: DERIVATIVE
      type: query
      description: "Loại thị trường. Hiện tại chỉ hỗ trợ phái sinh."
    - name: positionId
      value: "{{positionId}}"
      type: path
      description: "Id vị thế"
  auth: inherit

runtime:
  variables:
    - name: positionId
      value: "177410795472387"
  scripts:
    - type: tests
      code: |-
        test("response matches the schema", function () {
          const schema = {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "title": "ReversePositionResponse",
            "type": "object",
            "properties": {
              "id": {"type": "integer"},
              "side": {"type": "string"},
              "accountNo": {"type": "string"},
              "symbol": {"type": "string"},
              "price": {"type": "number"},
              "quantity": {"type": "integer"},
              "orderType": {"type": "string"},
              "loanPackageId": {"type": "integer"},
              "createdDate": {"type": "string"},
              "modifiedDate": {"type": "string"}
            }
          }

          res.status === 200 && expect(res.body).to.have.jsonSchema(schema);
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

