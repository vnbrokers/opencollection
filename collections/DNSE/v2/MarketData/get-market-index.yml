                    "fluctuationUpIssueCount": { "type": "integer" },
                    "fluctuationSteadinessIssueCount": { "type": "integer" },
                    "fluctuationDownIssueCount": { "type": "integer" },
                    "fluctuationLowerLimitIssueCount": { "type": "integer" },
                    "fluctuationUpIssueVolume": { "type": "integer" },
                    "fluctuationSteadinessIssueVolume": { "type": "integer" },
                    "fluctuationDownIssueVolume": { "type": "integer" },
