info:
  name: Giá realtime trái phiếu
  type: http
  seq: 29
http:
  method: GET
  url: "{{baseUrl}}/market/quotes/bonds/{{symbol}}"
  params:
    - name: symbol
      value: "{{symbol}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  Dữ liệu realtime của 1 mã trái phiếu kèm `yield` (lợi suất %). `symbol` không phân biệt hoa thường. Với trái phiếu Chính phủ (VN10Y, US10Y, JP10Y, DE10Y): chỉ có `yield`, các trường giá là `null`.
