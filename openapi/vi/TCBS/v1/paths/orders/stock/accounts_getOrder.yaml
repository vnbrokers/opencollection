"get":
  operationId: accounts_getOrder
  tags:
    - stock-orders
  "summary": "Lấy sổ lệnh theo Order ID"
  "description": "Lấy một lệnh theo Order ID của tiểu khoản."
  "parameters":
    - "name": "accountNo"
      "in": "path"
      "required": true
      "description": "Số tiểu khoản."
      "schema":
        "type": "string"
    - "name": "orderID"
      "in": "path"
      "required": true
      "description": "Order ID."
      "schema":
        "type": "string"
  responses:
    "401":
      $ref: ../../../components/responses/Unauthorized.yaml
    "200":
      description: Phản hồi thành công
      content:
        application/json:
          schema:
            $ref: ../../../components/schemas/orders/OrderDetailResponse.yaml
          example:
            object: List
            pageSize: 10
            pageIndex: 1
            totalCount: 1
            data:
              - orderID: "9202110200000060280"
                accountNo: "0001170730"
                symbol: HPG
                execType: NB
                orderQtty: 2500
                execQtty: 0
                priceType: LO
                limitPrice: 25000
                matchPrice: 0
                orStatus: "11"
                txdate: 2021-08-19T00:00:00.000+07:00
                txtime: 14:15:34
