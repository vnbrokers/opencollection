info:
  name: stocksGetProprietaryTradingHistory
  type: http
  seq: 51
http:
  method: GET
  url: "{{baseUrl}}/market/stocks/{{symbol}}/trading/proprietary/history?from={{from}}&to={{to}}&resolution={{resolution}}"
  params:
    - name: symbol
      value: "{{symbol}}"
      type: path
    - name: from
      value: "{{from}}"
      type: query
    - name: to
      value: "{{to}}"
      type: query
    - name: resolution
      value: "{{resolution}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  Chuỗi mua / bán / ròng của khối tự doanh theo phiên. `from`/`to` phải truyền cùng nhau (dạng `YYYY-MM-DD`, khoảng tối đa 5 năm); bỏ trống cả hai → 3 tháng gần nhất. Chưa phân trang.
