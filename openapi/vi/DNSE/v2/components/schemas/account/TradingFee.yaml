type: object
description: Thông tin biểu phí phái sinh (áp dụng cho DERIVATIVE)
properties:
  id:
    type: integer
    format: int32
    example: 2404
    description: Id chính sách phí phái sinh
  name:
    type: string
    example: 2000/HĐ
    description: Tên chính sách phí
  scope:
    type: string
    example: PRODUCT
    description: Phạm vi áp dụng
  channel:
    type: string
    example: ALL
    description: Kênh áp dụng
  schemaType:
    allOf:
      - $ref: ../enums/TradingFeeSchemaType.yaml
    example: FIXED
    description: "Loại biểu phí

      FIXED: Phí cố định

      PROGRESSIVE: Phí lũy tiến"
  createdDate:
    type: string
    format: date-time
    example: "2022-12-13T08:22:12.530837Z"
    description: Thời điểm áp dụng
  modifiedDate:
    type: string
    format: date-time
    example: "2022-12-13T08:22:12.530837Z"
    description: Thời điểm cập nhật
  fixedTradingFee:
    type: integer
    format: int32
    example: 2000
    description: Phí cố định trên 1 hợp đồng
  fixedDailyCloseTradingFee:
    type: integer
    format: int32
    example: 2000
    description: Phí đóng vị thế trong ngày
  progressTradingFee:
    type: array
    description: Phí giao dịch lũy tiến
    items:
      $ref: ./ProgressiveTradingFee.yaml
  progressDailyCloseTradingFee:
    type: array
    description: Phí đóng vị thế trong ngày lũy tiến
    items:
      $ref: ./ProgressiveDailyCloseTradingFee.yaml
